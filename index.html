<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6FD6">
<title>中1 テスト対策ドリル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FD; --grid:#DCE6F3; --ink:#1E2A44; --sub:#5B6782; --line:#C9D5E6; --card:#FFFFFF;
  --ok:#1F9D57; --ng:#D9463E;
  --kokugo:#D9463E; --sugaku:#2F6FD6; --rika:#2E9E5B; --shakai:#D9821A; --eigo:#8A4FD0;
  --accent:var(--sugaku);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131926; --grid:#1D2638; --ink:#E7EDF7; --sub:#9AA7C0; --line:#2C3850; --card:#1A2232;
    --ok:#3CC57A; --ng:#F06A62;
    --kokugo:#F06A62; --sugaku:#5C93F0; --rika:#4CC27F; --shakai:#F0A04A; --eigo:#AC7DEB;
  }
}
:root[data-theme="dark"]{
  --paper:#131926; --grid:#1D2638; --ink:#E7EDF7; --sub:#9AA7C0; --line:#2C3850; --card:#1A2232;
  --ok:#3CC57A; --ng:#F06A62;
  --kokugo:#F06A62; --sugaku:#5C93F0; --rika:#4CC27F; --shakai:#F0A04A; --eigo:#AC7DEB;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-weight:500;line-height:1.7;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.65rem;font-weight:900;margin:8px 0 2px;letter-spacing:.02em}
h2{font-size:1.2rem;font-weight:900;margin:0 0 12px}
.lead{color:var(--sub);margin:0 0 20px;font-size:.95rem}
.term{display:inline-block;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.9rem}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.subj{
  appearance:none;border:none;cursor:pointer;text-align:left;font:inherit;color:#fff;
  background:var(--c);border-radius:14px;padding:16px 16px 14px;min-height:104px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000);
  transition:transform .08s ease, box-shadow .08s ease;
}
.subj:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#000)}
.subj .k{font-size:1.9rem;font-weight:900;line-height:1.1}
.subj .s{font-size:.8rem;opacity:.92;margin-top:6px}
.subj.wide{grid-column:1 / -1;min-height:84px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel.top{border-top:6px solid var(--accent)}
.back{appearance:none;background:none;border:none;color:var(--sub);font:inherit;font-weight:700;padding:6px 0;cursor:pointer}
label.row{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
label.row:last-child{border-bottom:none}
label.row input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.grp{font-size:.82rem;color:var(--sub);font-weight:700;margin:12px 0 2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  appearance:none;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem
}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
textarea{
  width:100%;min-height:76px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:2px solid var(--line);border-radius:10px;padding:10px;resize:vertical
}
.hint{font-size:.8rem;color:var(--sub);margin:6px 0 0}
.btn{
  display:block;width:100%;appearance:none;border:none;cursor:pointer;font:inherit;font-weight:900;
  font-size:1.1rem;color:#fff;background:var(--accent);border-radius:14px;padding:15px;margin-top:18px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--sub);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.unitTag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:0 8px;margin-bottom:8px}
.q{font-size:1.08rem;font-weight:700;white-space:pre-wrap;margin:0 0 14px;overflow-wrap:anywhere}
.choices{display:grid;gap:10px}
.choice{
  appearance:none;text-align:left;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere
}
.choice b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-size:.85rem}
.choice.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.choice.correct b{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--card))}
.choice.wrong b{background:var(--ng);border-color:var(--ng);color:#fff}
.choice:disabled{cursor:default}
.verdict{font-size:1.3rem;font-weight:900;margin:16px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:var(--paper);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.big{font-size:3.4rem;font-weight:900;line-height:1;margin:8px 0}
.review{border-top:1px dashed var(--line);padding:12px 0}
.review:first-child{border-top:none}
.review .mk{font-weight:900;margin-right:6px}
.loading{text-align:center;padding:30px 10px}
.pencil{display:inline-block;font-size:2.4rem;animation:wr 1.2s ease-in-out infinite}
@keyframes wr{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}.bar i{transition:none}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stat{font-size:.8rem;color:var(--sub);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:2px 8px}
.notice{background:color-mix(in srgb,var(--ng) 10%,var(--card));border:2px solid var(--ng);border-radius:12px;padding:12px;margin-top:14px;font-size:.92rem}
.hidden{display:none !important}
.pad{margin:4px 0 14px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.pad[data-pad="ans"]{border-color:var(--accent)}
.padBar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.padTitle{font-weight:700;font-size:.85rem;color:var(--sub)}
.pad[data-pad="ans"] .padTitle{color:var(--accent)}
.padTools{display:flex;gap:6px}
.padTools button{appearance:none;font:inherit;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.padTools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pad canvas{display:block;width:100%;touch-action:none;cursor:crosshair;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.pad.locked canvas{pointer-events:none;cursor:default}
.pad.locked .padTools{display:none}
.answerBox{border:2px solid var(--accent);border-radius:12px;padding:12px;margin-top:4px}
.answerLabel{font-size:.8rem;font-weight:700;color:var(--accent)}
.answerMain{font-size:1.5rem;font-weight:900;margin:2px 0 4px;overflow-wrap:anywhere}
.answerBox .exp{margin-top:8px}
.ask{font-weight:700;margin:16px 0 8px;text-align:center}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:900;font-size:1.2rem;color:#fff;border-radius:14px;padding:16px 8px}
.gbtn.ok{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.gbtn.ng{background:var(--ng);box-shadow:0 4px 0 color-mix(in srgb,var(--ng) 70%,#000)}
.gbtn:active{transform:translateY(3px);box-shadow:none}
.myAns{display:block;max-width:100%;border:1.5px solid var(--line);border-radius:8px;margin:4px 0;background:var(--paper)}
.typeTag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--sub);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;margin-bottom:8px}
.write input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px}
.write input.okIn{border-color:var(--ok)} .write input.ngIn{border-color:var(--ng)}
.correct{margin:0 0 8px;font-weight:700}
.correct .hint{display:block;font-weight:500}
.link{appearance:none;background:none;border:none;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer;padding:10px 0 0;font-size:.9rem;display:block}
.link.quit{color:var(--sub);margin-top:14px;font-size:.82rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

DATA.kokugo[3]=[["w","漢字の読み","「穏やか」の読みをひらがなで書きなさい。","おだやか","「穏」は「おだ（やか）」と読みます。音読みは「オン」（平穏）。"],["w","漢字の読み","「僅か」の読みをひらがなで書きなさい。","わずか","「僅か」は「わずか」。ほんの少しという意味です。"],["w","漢字の読み","「概略」の読みをひらがなで書きなさい。","がいりゃく","「概」は「ガイ」。概略は「だいたいのあらまし」という意味です。"],["w","漢字の読み","「抑揚」の読みをひらがなで書きなさい。","よくよう","声の調子の上げ下げのことを「抑揚（よくよう）」といいます。"],["w","漢字の読み","「繊細」の読みをひらがなで書きなさい。","せんさい","「繊」は「セン」。細やかでこわれやすい様子を表します。"],["w","漢字の読み","「顕著」の読みをひらがなで書きなさい。","けんちょ","「顕」は「ケン」、「著」は「チョ」。はっきり目立つという意味です。"],["w","漢字の読み","「慎重」の読みをひらがなで書きなさい。","しんちょう","「慎」は「シン」。注意深く行う様子です。"],["w","漢字の読み","「鮮やか」の読みをひらがなで書きなさい。","あざやか","「鮮」の訓読みは「あざ（やか）」、音読みは「セン」（新鮮）です。"],["w","漢字の読み","「把握」の読みをひらがなで書きなさい。","はあく","「把握」は「はあく」。しっかり理解することです。"],["w","漢字の読み","「貢献」の読みをひらがなで書きなさい。","こうけん","「貢」は「コウ」、「献」は「ケン」。役に立つことをするという意味です。"],["w","漢字の読み","「促す」の読みをひらがなで書きなさい。","うながす","「促」の訓読みは「うなが（す）」、音読みは「ソク」（促進）です。"],["w","漢字の読み","「頻繁」の読みをひらがなで書きなさい。","ひんぱん","「頻繁」は「ひんぱん」。何度もくり返される様子です。"],["w","漢字の読み","「遂げる」の読みをひらがなで書きなさい。","とげる","「遂」の訓読みは「と（げる）」、音読みは「スイ」（完遂）です。"],["w","漢字の読み","「拒む」の読みをひらがなで書きなさい。","こばむ","「拒」の訓読みは「こば（む）」、音読みは「キョ」（拒否）です。"],["w","漢字の読み","「譲歩」の読みをひらがなで書きなさい。","じょうほ","「譲」は「ジョウ」。自分の意見をおさえて相手にゆずることです。"],["w","漢字の読み","「緩やか」の読みをひらがなで書きなさい。","ゆるやか","「緩」の訓読みは「ゆる（やか）」、音読みは「カン」（緩和）です。"],["w","漢字の読み","「漂う」の読みをひらがなで書きなさい。","ただよう","「漂」の訓読みは「ただよ（う）」、音読みは「ヒョウ」（漂流）です。"],["w","漢字の読み","「沈黙」の読みをひらがなで書きなさい。","ちんもく","「沈」は「チン」、「黙」は「モク」。だまっていることです。"],["w","漢字の読み","「偏る」の読みをひらがなで書きなさい。","かたよる","「偏」の訓読みは「かたよ（る）」、音読みは「ヘン」（偏見）です。"],["w","漢字の読み","「唐突」の読みをひらがなで書きなさい。","とうとつ","「唐突」は「とうとつ」。だしぬけで急な様子です。"],["w","漢字の読み","「懸命」の読みをひらがなで書きなさい。","けんめい","「懸」は「ケン」。力のかぎりがんばる様子です。"],["w","漢字の読み","「携える」の読みをひらがなで書きなさい。","たずさえる","「携」の訓読みは「たずさ（える）」、音読みは「ケイ」（携帯）です。"],["w","漢字の読み","「朗らか」の読みをひらがなで書きなさい。","ほがらか","「朗」の訓読みは「ほが（らか）」、音読みは「ロウ」（朗読）です。"],["w","漢字の読み","「惜しい」の読みをひらがなで書きなさい。","おしい","「惜」の訓読みは「お（しい）」、音読みは「セキ」（惜別）です。"],["w","漢字の読み","「繁茂」の読みをひらがなで書きなさい。","はんも","草木がおいしげることを「繁茂（はんも）」といいます。"],["w","漢字の書き","「カンタンな問題」のカタカナを漢字で書きなさい。","簡単","「簡単」。「単」を「短」と書かないよう注意。"],["w","漢字の書き","「意見をノべる」のカタカナを漢字と送り仮名で書きなさい。","述べる","「述べる」。送り仮名は「べる」です。"],["w","漢字の書き","「タンジュンな仕組み」のカタカナを漢字で書きなさい。","単純","「単純」。「純」は糸へんです。"],["w","漢字の書き","「セイケツな服」のカタカナを漢字で書きなさい。","清潔","「清潔」。どちらもさんずいです。"],["w","漢字の書き","「荷物をアズける」のカタカナを漢字と送り仮名で書きなさい。","預ける","「預ける」。送り仮名は「ける」です。"],["w","漢字の書き","「ケイケンを積む」のカタカナを漢字で書きなさい。","経験","「経験」。「験」は馬へんです（「検」「険」と区別）。"],["w","漢字の書き","「責任をハたす」のカタカナを漢字と送り仮名で書きなさい。","果たす","「果たす」。送り仮名は「たす」です。"],["w","漢字の書き","「ヒョウジュンの大きさ」のカタカナを漢字で書きなさい。","標準","「標準」。「標」は木へんです。"],["w","漢字の書き","「エイセイ管理に気をつける」のカタカナを漢字で書きなさい。","衛生","健康を守ることは「衛生」。人工の星は「衛星」なので区別します。"],["w","漢字の書き","「列にナラぶ」のカタカナを漢字と送り仮名で書きなさい。","並ぶ","「並ぶ」。送り仮名は「ぶ」です。"],["w","漢字の書き","「コンナンを乗りこえる」のカタカナを漢字で書きなさい。","困難","「困難」。「難」は「むずかしい」の意味です。"],["w","漢字の書き","「失敗をミトめる」のカタカナを漢字と送り仮名で書きなさい。","認める","「認める」。送り仮名は「める」です。"],["w","漢字の書き","「ギモンに思う」のカタカナを漢字で書きなさい。","疑問","「疑問」。「疑」は「うたが（う）」とも読みます。"],["w","漢字の書き","「ユウシュウな成績」のカタカナを漢字で書きなさい。","優秀","「優秀」。「秀」は「ひい（でる）」とも読みます。"],["w","漢字の書き","「答えをカクニンする」のカタカナを漢字で書きなさい。","確認","「確認」。「確」は石へんです。"],["w","漢字の書き","「道にマヨう」のカタカナを漢字と送り仮名で書きなさい。","迷う","「迷う」。送り仮名は「う」です。"],["w","漢字の書き","「毎日のドリョク」のカタカナを漢字で書きなさい。","努力","「努力」。「努」の下は「力」です。"],["w","漢字の書き","「意見をソンチョウする」のカタカナを漢字で書きなさい。","尊重","「尊重」。大切にあつかうという意味です。"],["w","漢字の書き","「今日はアタタかい日だ」のカタカナを漢字と送り仮名で書きなさい。","暖かい","気温には「暖かい」、物や心には「温かい」を使います。"],["w","漢字の書き","「ユウビン局」のカタカナを漢字で書きなさい。","郵便","「郵便」。「郵」はおおざとです。"],["w","漢字の書き","「シュクダイを出す」のカタカナを漢字で書きなさい。","宿題","「宿題」。"],["w","漢字の書き","「会議をヒラく」のカタカナを漢字と送り仮名で書きなさい。","開く","「開く」。送り仮名は「く」です。"],["w","漢字の書き","「イサギヨく負けを認める」のカタカナを漢字と送り仮名で書きなさい。","潔く","「潔い」の連用形で「潔く」。送り仮名に注意します。"],["w","漢字の書き","「セイジツな人柄」のカタカナを漢字で書きなさい。","誠実","「誠実」。まじめで真心がある様子です。"],["w","漢字の書き","「時間をハカる」のカタカナを漢字と送り仮名で書きなさい。","計る","時間は「計る」、長さは「測る」、重さは「量る」です。"],["w","文法","「私は毎朝早く起きる。」はいくつの文節に分けられますか。数字で答えなさい。","4","私は／毎朝／早く／起きる　の4文節。「ネ」を入れて区切れるところが文節の切れ目です。"],["w","文法","「庭に赤い花が咲いた。」はいくつの文節に分けられますか。数字で答えなさい。","4","庭に／赤い／花が／咲いた　の4文節です。"],["w","文法","「弟が公園で遊んでいる。」はいくつの文節に分けられますか。数字で答えなさい。","4","弟が／公園で／遊んで／いる　の4文節。「遊んで」と「いる」は別の文節です（補助の関係）。"],["w","文法","「明日は雨が降るらしい。」はいくつの文節に分けられますか。数字で答えなさい。","3","明日は／雨が／降るらしい　の3文節。「らしい」は付属語なので前の文節にふくまれます。"],["w","文法","「大きな木の下で本を読んだ。」はいくつの文節に分けられますか。数字で答えなさい。","5","大きな／木の／下で／本を／読んだ　の5文節です。"],["w","文法","「花が咲く。」はいくつの単語に分けられますか。数字で答えなさい。","3","花／が／咲く　の3単語。「が」は助詞で1単語です。"],["w","文法","「私は本を読んだ。」はいくつの単語に分けられますか。数字で答えなさい。","6","私／は／本／を／読ん／だ　の6単語。「読んだ」は「読ん」と助動詞「だ」に分かれます。"],["w","文法","「空がとても青い。」はいくつの単語に分けられますか。数字で答えなさい。","4","空／が／とても／青い　の4単語です。"],["w","文法","「昨日、兄が駅で友達に会った。」の主語を文節で書きなさい。","兄が|兄","「だれが」にあたる「兄が」が主語です。"],["w","文法","「昨日、兄が駅で友達に会った。」の述語を文節で書きなさい。","会った","「どうした」にあたる「会った」が述語です。"],["w","文法","「白い犬が走る。」で「白い」が修飾している文節を書きなさい。","犬が","「白い→犬が」とつながります。「白い」は「犬が」をくわしくしています。"],["w","文法","「雨が降った。だから、試合は中止だ。」の「だから」は文の成分として何ですか。","接続語","前後の文をつなぐはたらきをしているので接続語です。"],["w","文法","「はい、私が行きます。」の「はい」は文の成分として何ですか。","独立語","応答の言葉で、ほかの文節と直接関係しないので独立語です。"],["w","文法","「おや、雪が降ってきた。」の「おや」は文の成分として何ですか。","独立語","感動を表す言葉で、ほかの文節から独立しているので独立語です。"],["w","文法","「風が強いので、窓を閉めた。」の「風が強いので」は何部ですか。","接続部","2つ以上の文節で理由を表し、あとにつないでいるので接続部です。"],["w","文法","「ぼくの兄は医者だ。」の主部を書きなさい。","ぼくの兄は","「ぼくの兄は」の2文節がまとまって主語のはたらきをしているので主部です。"],["w","文法","「赤い　花」の2つの文節の関係は何ですか。「〇〇の関係」の形で答えなさい。","修飾・被修飾の関係|修飾・被修飾|修飾被修飾","「赤い」が「花」をくわしくしているので修飾・被修飾の関係です。"],["w","文法","「本とノートを買う」の「本と」と「ノートを」の関係は何ですか。「〇〇の関係」の形で答えなさい。","並立の関係|並立","2つが対等にならんでいるので並立の関係です。入れかえても意味が変わりません。"],["w","文法","「読んで　いる」の2つの文節の関係は何ですか。「〇〇の関係」の形で答えなさい。","補助の関係|補助","「いる」が「読んで」に意味をそえているので補助の関係です。"],["w","文法","「鳥が　鳴く」の2つの文節の関係は何ですか。「〇〇の関係」の形で答えなさい。","主・述の関係|主・述|主述|主語・述語の関係","「何が―どうする」の形なので主・述の関係です。"],["w","文法","「寒いので、上着を着る」の「寒いので」と「着る」の関係は何ですか。「〇〇の関係」の形で答えなさい。","接続の関係|接続","「寒いので」が理由を表してあとにつないでいるので接続の関係です。"],["w","文法","「大きくて重い荷物」の「大きくて」と「重い」の関係は何ですか。「〇〇の関係」の形で答えなさい。","並立の関係|並立","どちらも「荷物」の様子を対等に表しているので並立の関係です。"],["w","文法","「書いて　みる」の2つの文節の関係は何ですか。「〇〇の関係」の形で答えなさい。","補助の関係|補助","「みる」は「ためしに〜する」という意味をそえているので補助の関係です。"],["w","文法","「ゆっくり　歩く」の2つの文節の関係は何ですか。「〇〇の関係」の形で答えなさい。","修飾・被修飾の関係|修飾・被修飾|修飾被修飾","「ゆっくり」が「歩く」をくわしくしているので修飾・被修飾の関係です。"],["w","語句","慣用句「（　）が高い」＝得意になる様子。（　）に入る体の部分を漢字1字で書きなさい。","鼻","「鼻が高い」は、自慢に思う・得意になる様子です。"],["w","語句"," 「お」になります。"],["w","歴史的仮名遣い","「けふ」を現代仮名遣いに直して、ひらがなで書きなさい。","きょう","「ふ」→「う」で「けう」、「eう」は「よう」の音になるので「きょう」です。"],["w","歴史的仮名遣い","「てふ」（ちょう＝虫の名）を現代仮名遣いに直して、ひらがなで書きなさい。","ちょう","「ふ」→「う」で「てう」、「eう」は「よう」の音になるので「ちょう」です。"],["w","歴史的仮名遣い","「やうやう」を現代仮名遣いに直して、ひらがなで書きなさい。","ようよう","「あう（au）」は「おう（ou）」の音になり、「やう」→「よう」です。"],["w","歴史的仮名遣い","「まうす」を現代仮名遣いに直して、ひらがなで書きなさい。","もうす","「まう」→「もう」になります。"],["w","歴史的仮名遣い","「くわし」（菓子）を現代仮名遣いに直して、ひらがなで書きなさい。","かし","「くわ」は「か」になります。"],["w","歴史的仮名遣い","「もみぢ」を現代仮名遣いに直して、ひらがなで書きなさい。","もみじ","「ぢ」は「じ」になります。"],["w","歴史的仮名遣い","「しづか」を現代仮名遣いに直して、ひらがなで書きなさい。","しずか","「づ」は「ず」になります。"],["w","歴史的仮名遣い","「いはく」を現代仮名遣いに直して、ひらがなで書きなさい。","いわく","語中の「は」は「わ」になります。"],["w","歴史的仮名遣い","「あはれ」を現代仮名遣いに直して、ひらがなで書きなさい。","あわれ","語中の「は」は「わ」になります。"],["w","歴史的仮名遣い","「うつくしう」を現代仮名遣いに直して、ひらがなで書きなさい。","うつくしゅう","「いう（iu）」は「ゆう（yuu）」の音になり、「しう」→「しゅう」です。"],["w","歴史的仮名遣い","「ゆゑ」を現代仮名遣いに直して、ひらがなで書きなさい。","ゆえ","「ゑ」は「え」になります。"],["w","歴史的仮名遣い","「あふぎ」（扇）を現代仮名遣いに直して、ひらがなで書きなさい。","おうぎ","「あふ」→「あう」→「おう」となります。"],["w","歴史的仮名遣い","「かほ」（顔）を現代仮名遣いに直して、ひらがなで書きなさい。","かお","語中の「ほ」は「お」になります。"],["w","歴史的仮名遣い","「なむ」を現代仮名遣いに直して、ひらがなで書きなさい。","なん","助詞・助動詞の「む」は「ん」と読みます。"],["w","竹取物語","現存する日本最古の物語といわれる、かぐや姫の物語の作品名を書きなさい。","竹取物語","「竹取物語」は、物語の祖ともいわれます。"],["w","竹取物語","「竹取物語」が成立した時代を書きなさい。","平安時代|平安","平安時代の初めごろに成立しました。"],["w","竹取物語","「竹取物語」の作者はわかっていますか。「わかっている」か「わかっていない」で答えなさい。","わかっていない","作者はわかっていません。"],["w","竹取物語","「竹取物語」で、竹の中から見つけられた女の子の名前を書きなさい。","かぐや姫|かぐやひめ","成長して「なよ竹のかぐや姫」と名づけられます。"],["w","竹取物語","竹取の翁の名前をひらがなで書きなさい。","さぬきのみやつこ|さかきのみやつこ","本文では「さぬきのみやつこ」となっています。"],["w","竹取物語","竹取の翁が竹の中で見つけた女の子の大きさは、およそ何寸でしたか。","三寸|3寸|三|3","「三寸ばかりなる人」と書かれています。"],["w","竹取物語","「今は昔、竹取の翁といふ者ありけり。」の「いふ」を現代仮名遣いに直しなさい。","いう","語中の「ふ」は「う」になります。"],["w","竹取物語","「竹取の翁といふ者ありけり」の「ありけり」を現代語に直しなさい（ひらがな2字）。","いた","「けり」は過去を表し、「ありけり」は「いた」という意味です。"],["w","竹取物語","「よろづのことに使ひけり」の古語「よろづ」の意味を、ひらがな4字で書きなさい。","いろいろ|さまざま","「よろづ」は「いろいろ・たくさん」という意味です。"],["w","竹取物語","「あやしがりて寄りて見るに」の古語「あやし」の意味を、現代語で書きなさい。","不思議|ふしぎ|不思議だ|ふしぎだ","古語の「あやし」は「不思議だ」という意味です。"],["w","竹取物語","「いとうつくしうてゐたり」の古語「うつくし」の意味を、現代語で書きなさい。","かわいらしい|かわいい|可愛い|可愛らしい","古語の「うつくし」は「かわいらしい」という意味です。"],["w","竹取物語","古文の「いと」は現代語で何という意味ですか。ひらがなで書きなさい。","とても|たいそう|ひじょうに","「いと」は「とても・たいそう」という意味です。"],["w","竹取物語","かぐや姫に結婚を申しこんだ貴公子は何人ですか。数字で答えなさい。","5","5人の貴公子が求婚しました。","人"],["w","竹取物語","かぐや姫は求婚した貴公子たちに、手に入れるのが難しい何を持ってくるように言いましたか。漢字2字で答えなさい。","宝物","めったに手に入らない宝物を持ってくるように言いました。"],["w","竹取物語","かぐや姫が最後に帰っていったところはどこですか。","月|月の都","かぐや姫は月の都の人でした。"],["w","竹取物語","かぐや姫が帝（天皇）に残していったものは、手紙と何ですか。","不死の薬|ふしのくすり|薬","かぐや姫は手紙と不死の薬を残しました。"],["w","竹取物語","帝が不死の薬を焼かせた、天に最も近い山はどこですか。","富士山|富士の山|ふじの山|富士","物語では、薬は富士の山の頂上で焼かれました。"],["w","竹取物語","物語の最後で「ふじの山」と名づけられたのは、何をたくさん連れて登ったからですか。漢字2字で答えなさい。","兵士|士|武士|つわもの","多くの兵士（士に富む）を連れて登ったことから名づけたと書かれています。"]];
DATA.rika[3]=[["w","実験器具","ガスバーナーの2つのねじのうち、上にあるのは何を調節するねじですか。","空気調節ねじ|空気","上が空気調節ねじ、下がガス調節ねじです。"],["w","実験器具","ガスバーナーの2つのねじのうち、下にあるのは何を調節するねじですか。","ガス調節ねじ|ガス","下がガス調節ねじです。"],["w","実験器具","ガスバーナーに火をつけるとき、マッチの火を近づけてから最初に開くねじは何ですか。","ガス調節ねじ|ガス","元栓とコックを開き、火を近づけてからガス調節ねじを開きます。その後、空気調節ねじで炎を調節します。"],["w","実験器具","ガスバーナーの炎がオレンジ色（赤色）でゆらゆらしているとき、何が不足していますか。","空気|酸素","空気が足りないと赤い炎になります。空気調節ねじを開いて青い炎にします。"],["w","実験器具","ガスバーナーの火を消すとき、最初に閉じるねじは何ですか。","空気調節ねじ|空気","つけるときと逆の順で、空気調節ねじ→ガス調節ねじ→コック→元栓の順に閉じます。"],["w","実験器具","メスシリンダーの目盛りは、液面のいちばん高いところと低いところのどちらを読みますか。","低いところ|低い|いちばん低いところ","液面はへこんでいるので、真横から液面の低いところを読みます。"],["w","実験器具","メスシリンダーでは、最小目盛りの何分の1まで目分量で読みますか。「〇分の1」の形で答えなさい。","10分の1|1/10|十分の一|十分の1","最小目盛りの10分の1まで目分量で読みます。"],["w","実験器具","右ききの人が上皿てんびんで薬品を一定量はかりとるとき、分銅は左右どちらの皿にのせますか。","左|左の皿|左側","はかりとりたい質量の分銅を左（きき手と反対）にのせ、きき手側の右の皿で薬品を少しずつ加えます。"],["w","実験器具","上皿てんびんは、針が左右にどのようにふれていればつり合ったと判断しますか。「左右に〇〇〇〇ふれている」の〇〇〇〇を書きなさい。","等しく|ひとしく","針が止まるのを待たず、左右に等しくふれていればつり合っています。"],["w","物質の性質","使う目的や形に注目したときの「もの」の呼び方を何といいますか。","物体","コップ・スプーンなど形や目的に注目したよび方が物体、ガラス・鉄など材料に注目したよび方が物質です。"],["w","物質の性質","ガラス・鉄・プラスチックのように、ものをつくっている材料に注目したときの呼び方を何といいますか。","物質","材料に注目したよび方が物質です。"],["w","物質の性質","炭素をふくみ、加熱すると黒くこげて炭になったり、燃えて二酸化炭素を出したりする物質を何といいますか。","有機物","炭素をふくむ物質を有機物といいます。"],["w","物質の性質","有機物以外の物質を何といいますか。","無機物","有機物以外の物質が無機物です。食塩・ガラス・金属などがあります。"],["w","物質の性質","有機物が燃えると、二酸化炭素と何ができますか。","水|水蒸気","有機物は炭素と水素をふくむので、燃えると二酸化炭素と水ができます。"],["w","物質の性質","食塩は有機物と無機物のどちらですか。","無機物","食塩は加熱してもこげず、燃えても二酸化炭素を出さない無機物です。"],["w","物質の性質","砂糖は有機物と無機物のどちらですか。","有機物","砂糖は加熱すると黒くこげて炭になるので有機物です。"],["w","物質の性質","プラスチックは有機物と無機物のどちらですか。","有機物","プラスチックは石油からつくられ、炭素をふくむ有機物です。"],["w","物質の性質","鉄など一部の金属だけにあり、すべての金属に共通する性質ではないのは「〇〇につく」です。〇〇に入る言葉を書きなさい。","磁石","磁石につくのは鉄など一部の金属だけです。"],["w","物質の性質","金属をみがくと見られる、特有のかがやきを何といいますか。","金属光沢","金属に共通する性質の1つが金属光沢です。"],["w","物質の性質","金属の、たたくとうすく広がる性質を何といいますか。","展性","たたくと広がる性質が展性、引っぱるとのびる性質が延性です。"],["w","物質の性質","金属の、引っぱるとのびる性質を何といいますか。","延性","引っぱるとのびる性質が延性です。"],["w","物質の性質","鉄とアルミニウムのうち、磁石につかないのはどちらですか。","アルミニウム","アルミニウムは金属ですが磁石につきません。"],["w","物質の性質","銅・ガラス・ゴムのうち、電気をよく通す物質はどれですか。","銅","銅は金属なので電気をよく通します。"],["w","物質の性質","密度＝（　）÷体積。（　）に入る言葉を書きなさい。","質量","密度＝質量（g）÷体積（cm³）です。"],["w","物質の性質","密度の単位を書きなさい（cm³は cm3 と入力してもよい）。","g/cm3|g/cm³|グラム毎立方センチメートル","1cm³あたりの質量なので g/cm³ を使います。"],["w","物質の性質","質量54g、体積20cm³の物質の密度は何g/cm³ですか。数字で答えなさい。","2.7","54÷20＝2.7（g/cm³）。アルミニウムの密度と同じです。","g/cm3"],["w","物質の性質","質量78.7g、体積10cm³の物質の密度は何g/cm³ですか。数字で答えなさい。","7.87","78.7÷10＝7.87（g/cm³）。鉄の密度と同じです。","g/cm3"],["w","物質の性質","密度2.7g/cm³の物質30cm³の質量は何gですか。数字で答えなさい。","81","質量＝密度×体積＝2.7×30＝81（g）。","g"],["w","物質の性質","密度8.96g/cm³の銅44.8gの体積は何cm³ですか。数字で答えなさい。","5","体積＝質量÷密度＝44.8÷8.96＝5（cm³）。","cm3"],["w","物質の性質","水の密度はおよそ何g/cm³ですか。数字で答えなさい。","1|1.0","水の密度は約1.0g/cm³です。","g/cm3"],["w","物質の性質","密度が1.0g/cm³より小さい固体を水に入れると、浮きますか、しずみますか。","浮く|うく|浮きます","水より密度が小さい物体は水に浮きます。"],["w","物質の性質","場所が変わっても変わらない、物質そのものの量を何といいますか。","質量","上皿てんびんではかる量が質量で、単位はgやkgです。"],["w","物質の性質","砂糖・食塩・かたくり粉のうち、水にとけないのは何ですか。","かたくり粉|片栗粉|デンプン","かたくり粉（デンプン）は水にとけず、白くにごります。"],["w","物質の性質","白い粉末を加熱したら黒くこげました。この粉末は有機物と無機物のどちらと考えられますか。","有機物","黒くこげて炭になるのは炭素をふくむ有機物の特徴です。"],["w","物質の性質","二酸化炭素ができたかどうかを確かめるのに使う液体は何ですか。","石灰水","二酸化炭素は石灰水を白くにごらせます。"],["w","物質の性質","二酸化炭素を石灰水に通すと、石灰水はどうなりますか。","白くにごる|白くにごった|白濁する","二酸化炭素は石灰水を白くにごらせます。"],["w","物質の性質","1種類の物質だけでできているものを何といいますか。","純物質|純粋な物質","1種類の物質でできているものが純物質です。"],["w","物質の性質","2種類以上の物質が混ざり合ったものを何といいますか。","混合物","食塩水や空気は混合物です。"],["w","物質の性質","食塩水は純物質と混合物のどちらですか。","混合物","食塩と水が混ざっているので混合物です。"],["w","物質の性質","空気は純物質と混合物のどちらですか。","混合物","窒素・酸素などが混ざっているので混合物です。"],["w","気体","二酸化マンガンにうすい過酸化水素水（オキシドール）を加えると発生する気体は何ですか。","酸素","二酸化マンガンにオキシドールを加えると酸素が発生します。"],["w","気体","石灰石にうすい塩酸を加えると発生する気体は何ですか。","二酸化炭素|co2","石灰石（貝がらなど）にうすい塩酸を加えると二酸化炭素が発生します。"],["w","気体","亜鉛や鉄などの金属にうすい塩酸を加えると発生する気体は何ですか。","水素","亜鉛・鉄・マグネシウムなどにうすい塩酸を加えると水素が発生します。"],["w","気体","塩化アンモニウムと水酸化カルシウムを混ぜて加熱すると発生する気体は何ですか。","アンモニア","塩化アンモニウムと水酸化カルシウムの混合物を加熱するとアンモニアが発生します。"],["w","気体","貝がらにうすい塩酸を加えると発生する気体は何ですか。","二酸化炭素|co2","貝がらの主成分は石灰石と同じ炭酸カルシウムなので、二酸化炭素が発生します。"] の水溶液が炭酸水で、酸性を示します。"]];
DATA.rika[4]=[["w","状態変化","物質が温度によって、固体・液体・気体とすがたを変えることを何といいますか。","状態変化","状態変化では、物質そのものは別の物質に変わりません。"],["w","状態変化","状態変化で、物質の体積は変化しますが、変化しないものは何ですか。","質量","粒子の数は変わらないので質量は変わりません。"],["w","状態変化","一般に、物質が液体から固体に変わると体積は大きくなりますか、小さくなりますか。","小さくなる|小さく","多くの物質は固体になると体積が小さくなります。ロウが固まると中央がへこみます。"],["w","状態変化","水が液体から固体（氷）に変わると体積は大きくなりますか、小さくなりますか。","大きくなる|大きく","水は例外で、氷になると体積が大きくなります。"],["w","状態変化","氷が水に浮くのは、氷の何が水より小さいからですか。","密度","水は氷になると体積が大きくなり、密度が小さくなるので浮きます。"],["w","状態変化","粒子の間隔が最も広く、粒子が自由に飛び回っている状態を何といいますか。","気体","気体は粒子の間隔が最も広く、自由に飛び回っています。"],["w","状態変化","物質を加熱すると、粒子の運動は激しくなりますか、おだやかになりますか。","激しくなる|激しく|はげしくなる","温度が上がるほど粒子の運動は激しくなります。"],["w","状態変化","同じ質量の物質で、ふつう体積が最も大きいのはどの状態ですか。","気体","気体は粒子の間隔が広いので体積が最も大きくなります。"],["w","状態変化","水が水蒸気になると、体積はおよそ何倍になりますか。数字で答えなさい。","1700","水が水蒸気になると体積は約1700倍になります。","倍"],["w","状態変化","固体がとけて液体に変化するときの温度を何といいますか。","融点","純物質の融点は物質によって決まっています。"],["w","状態変化","液体が沸騰して気体に変化するときの温度を何といいますか。","沸点","純物質の沸点は物質によって決まっています。"],["w","状態変化","水の沸点は何℃ですか。数字で答えなさい。","100","水は100℃で沸騰します（1気圧のとき）。","℃"],["w","状態変化","水（氷）の融点は何℃ですか。数字で答えなさい。","0","氷は0℃でとけます。","℃"],["w","状態変化","水が沸騰している間、温度は何℃で一定になりますか。数字で答えなさい。","100","純物質は沸騰している間、温度が一定です。","℃"],["w","状態変化","純物質の融点や沸点は、物質の種類によって決まっていますか。「決まっている」か「決まっていない」で答えなさい。","決まっている|きまっている","融点や沸点は物質を見分ける手がかりになります。"],["w","状態変化","混合物の沸点は決まった温度になりますか。「なる」か「ならない」で答えなさい。","ならない","混合物の沸点は決まった温度になりません。"],["w","状態変化","エタノールの沸点はおよそ何℃ですか。数字で答えなさい。","78","エタノールの沸点は約78℃で、水より低いです。","℃"],["w","状態変化","液体を加熱して沸騰させ、出てくる気体を冷やして再び液体にしてとり出す方法を何といいますか。","蒸留","沸点のちがいを利用して物質を分けることができます。"],["w","状態変化","水とエタノールの混合物を加熱したとき、はじめに多く出てくる物質は何ですか。","エタノール","沸点の低いエタノールが先に多く出てきます。"],["w","状態変化","液体を加熱するとき、急に沸騰して液体が飛び出すことを何といいますか。","突沸","突沸を防ぐために沸騰石を入れます。"],["w","状態変化","突沸を防ぐために液体に入れるものを何といいますか。","沸騰石","沸騰石を入れて、おだやかに沸騰させます。"],["w","状態変化","蒸留ではじめに出てきた液体にエタノールが多いかを確かめるには、においをかぐほかに、何をつけて燃えるか調べますか。漢字1字で答えなさい。","火","エタノールには特有のにおいがあり、火をつけると燃えます。"],["w","状態変化","蒸留の実験で、温度計の液だめは、フラスコのどこの付け根の高さに置きますか。漢字1字で答えなさい（〇の付け根）。","枝","出ていく気体の温度をはかるため、枝の付け根の高さにします。"],["w","状態変化","蒸留の実験で火を消す前にガラス管を液から出しておくのは、液体が何するのを防ぐためですか。漢字2字で答えなさい。","逆流","ガラス管が液に入ったまま火を消すと、液が逆流して危険です。"],["w","光","太陽や電灯のように、自ら光を出すものを何といいますか。","光源","光源から出た光はまっすぐ進みます。"],["w","光","光が同じ物質の中をまっすぐ進むことを何といいますか。","光の直進|直進","光は同じ物質の中ではまっすぐ進みます。"],["w","光","光が物体の表面ではね返ることを何といいますか。","反射|光の反射","鏡などで光ははね返ります。"],["w","光","光が反射するとき、入射角と反射角の大きさはどうなりますか。","等しい|同じ|等しくなる","入射角＝反射角になります。"],["w","光","入射角と反射角が等しくなるという決まりを何といいますか。","反射の法則","光の反射の基本となる法則です。"],["w","光","鏡に入射角30°で光が当たったとき、反射角は何度ですか。数字で答えなさい。","30","反射の法則より、反射角も30°です。","°"],["w","光","表面に細かい凹凸があり、光がいろいろな方向に反射することを何といいますか。","乱反射","乱反射のおかげで、物体をいろいろな方向から見ることができます。"],["w","光","鏡にうつった像は、鏡をはさんで物体とどのような位置にあるように見えますか。漢字2字で答えなさい（〇〇の位置）。","対称","像は鏡に対して物体と対称の位置に見えます。"],["w","光","光が、種類のちがう物質の境界で折れ曲がって進むことを何といいますか。","屈折|光の屈折","空気から水へ進むときなどに起こります。"],["w","光","光が空気中から水中へ進むとき、屈折角は入射角より大きいですか、小さいですか。","小さい","空気→水では、屈折角は入射角より小さくなります。"],["w","光","光が水中から空気中へ進むとき、屈折角は入射角より大きいですか、小さいですか。","大きい","水→空気では、屈折角は入射角より大きくなります。"],["w","光","光が水中から空気中へ進むとき、入射角を大きくするとすべての光が反射します。この現象を何といいますか。","全反射","光ファイバーなどに利用されています。"],["w","光","全反射を利用して、光で情報を送るものを何といいますか。","光ファイバー","通信ケーブルなどに使われています。"],["w","光","水の入ったコップの中のストローが水面で折れ曲がって見えるのは、光の何という現象によるものですか。","屈折|光の屈折","水中から空気中へ進む光が屈折するためです。"],["w","光","太陽の光をプリズムに通すと、光はいろいろな何に分かれますか。漢字1字で答えなさい。","色","太陽の光（白色光）はいろいろな色の光が混ざっています。"],["w","光","凸レンズの軸に平行な光が、レンズで屈折して集まる点を何といいますか。","焦点","凸レンズの両側に1つずつあります。"],["w","光","凸レンズの中心から焦点までの距離を何といいますか。","焦点距離","レンズのふくらみが大きいほど焦点距離は短くなります。"],["w","光","凸レンズの中心を通った光はどのように進みますか。漢字2字で答えなさい。","直進|直進する","レンズの中心を通る光は直進します。"],["w","光","焦点を通って凸レンズに入った光は、レンズを通ったあと、軸に対してどのように進みますか。漢字2字で答えなさい（〇〇に進む）。","平行","焦点を通った光は、レンズで屈折したあと軸に平行に進みます。"],["w","光","凸レンズを通った光が実際に集まってスクリーンにうつる像を何といいますか。","実像","物体を焦点より外側に置くとできます。"],["w","光","虫めがねでのぞいたときに見える、スクリーンにはうつらない像を何といいますか。","虚像","物体を焦点より内側に置くと見えます。"],["w","光","実像の向きは、物体と比べて上下左右がどうなっていますか。漢字1字で答えなさい（上下左右が〇）。","逆","実像は上下左右が逆向きになります。"],["w","光","虚像の大きさは、物体より大きいですか、小さいですか。","大きい","虚像は物体と同じ向きで、大きく見えます。"],["w","光","物体を焦点距離の2倍の位置に置くと、実像の大きさは物体と比べてどうなりますか。「〇〇大きさ」の〇〇を書きなさい。","同じ|おなじ","焦点距離の2倍の位置に置くと、反対側の2倍の位置に同じ大きさの実像ができます。"],["w","光","焦点距離10cmの凸レンズの前方20cmに物体を置きました。レンズの後方何cmに実像ができますか。数字で答えなさい。","20","焦点距離の2倍（20cm）の位置に置いたので、後方20cmに同じ大きさの実像ができます。","cm"],["w","光","物体を焦点の外側から焦点に近づけていくと、実像は大きくなりますか、小さくなりますか。","大きくなる|大きく","焦点に近づけるほど、実像は大きくなりレンズから遠くにできます。"],["w","光","物体を焦点の内側に置いたとき、レンズをのぞくと見える像を何といいますか。","虚像","焦点の内側では実像はできず、レンズをのぞくと虚像が見えます。"],["w","光","凸レンズの上半分を黒い紙でかくすと、スクリーンの実像は明るくなりますか、暗くなりますか。","暗くなる|暗く","レンズの下半分を通った光でも像全体ができるので、形は変わらず暗くなります。"],["w","音","音を出している物体を何といいますか。","音源|発音体","音源（発音体）は振動しています。"],["w","音","音は、音源が何をすることによって生じますか。","振動|振動すること|ふるえること","音源が振動し、その振動が伝わって音になります。"],["w","音","音は水の中を伝わりますか。「伝わる」か「伝わらない」で答えなさい。","伝わる|つたわる","音は空気だけでなく、水や金属なども伝わります。"],["w","音","真空中で音は伝わりますか。「伝わる」か「伝わらない」で答えなさい。","伝わらない|つたわらない","音を伝える物質がないので、真空中では音は伝わりません。"],["w","音","糸電話で声が伝わるのは、主に何が振動するからですか。","糸","声の振動が紙コップから糸（固体）に伝わります。"],["w","音","音源の振動の振れ幅を何といいますか。","振幅","振幅が大きいほど大きな音になります。"],["w","音","音源が1秒間に振動する回数を何といいますか。","振動数","振動数が多いほど高い音になります。"],["w","音","振動数の単位をカタカナで書きなさい。","ヘルツ|hz","単位はヘルツ（記号Hz）です。"],["w","音","大きな音を出すとき、振幅は大きくなりますか、小さくなりますか。","大きくなる|大きく","音の大小は振幅で決まります。"],["w","音","高い音を出すとき、振動数は多くなりますか、少なくなりますか。","多くなる|多く","音の高低は振動数で決まります。"],["w","音","モノコードの弦を短くすると、音は高くなりますか、低くなりますか。","高くなる|高く","弦を短くすると振動数が多くなり、高い音になります。"],["w","音","モノコードの弦を強く張ると、音は高くなりますか、低くなりますか。","高くなる|高く","強く張ると振動数が多くなり、高い音になります。"],["w","音","モノコードの弦を太いものにかえると、音は高くなりますか、低くなりますか。","低くなる|低く","太い弦は振動数が少なくなり、低い音になります。"],["w","音","オシロスコープで、波の山の高さが表しているものは何ですか。","振幅","波の高さは振幅を表します。"],["w","音","オシロスコープで、同じ時間に表示される波の数が多いのは、高い音ですか、低い音ですか。","高い音|高い","波の数が多いほど振動数が多く、高い音です。"],["w","音","1秒間に440回振動する音の振動数は何Hzですか。数字で答えなさい。","440","1秒間の振動の回数がそのまま振動数です。","hz"],["w","音","0.5秒間に200回振動する音の振動数は何Hzですか。数字で答えなさい。","400","1秒間では 200÷0.5＝400（回）なので400Hzです。","hz"],["w","音","空気中を伝わる音の速さは、およそ秒速何mですか。数字で答えなさい。","340","音は空気中を1秒間に約340m進みます。","m/s"],["w","音","音と光では、どちらがはるかに速く伝わりますか。","光","光は約30万km/sで、音よりはるかに速いです。"],["w","音","雷の光が見えてから3秒後に音が聞こえました。音の速さを340m/sとすると、雷までの距離は何mですか。数字で答えなさい。","1020","340×3＝1020（m）。光はほぼ一瞬で届くと考えます。","m"],["w","音","打ち上げ花火の光が見えてから2秒後に音が聞こえました。音の速さを340m/sとすると、花火までの距離は何mですか。数字で答えなさい。","680","340×2＝680（m）です。","m"],["w","音","壁に向かって手をたたいたら、2秒後にはね返った音が聞こえました。音の速さを340m/sとすると、壁までの距離は何mですか。数字で答えなさい。","340","音は往復しているので、340×2÷2＝340（m）です。","m"],["w","音","同じ高さの音さを2つ並べ、一方をたたくともう一方も鳴り出しました。振動を伝えたものは何ですか。","空気","たたいた音さの振動が空気を伝わり、もう一方の音さをふるわせました。"],["w","音","人が聞くことのできる音の振動数の、およその上限は何Hzですか。数字で答えなさい。","20000","人はおよそ20Hzから20000Hzの音を聞くことができます。","hz"]];
DATA.rika[5]=[["w","力のはたらき","力の3つのはたらきは、物体の形を変える、物体の動きを変える、物体を（　）。（　）に入る言葉を書きなさい。","支える|ささえる","力には、形を変える・動きを変える・支えるの3つのはたらきがあります。"],["w","力のはたらき","地球が物体を、地球の中心に向かって引く力を何といいますか。","重力","重力は地球上のすべての物体にはたらいています。"],["w","力のはたらき","机の上の物体を、机の面が垂直におし返す力を何といいますか。","垂直抗力","物体が面をおすとき、面から垂直にはたらく力です。"],["w","力のはたらき","物体がふれ合っている面で、物体の動きをさまたげるようにはたらく力を何といいますか。","摩擦力|まさつ力","物体が動く向きと反対向きにはたらきます。"],["w","力のはたらき","変形した物体がもとにもどろうとする力を何といいますか。","弾性力|弾性の力|弾性","ばねやゴムなどがもとにもどろうとする力です。"],["w","力のはたらき","磁石どうしや、磁石と鉄の間ではたらく力を何といいますか。","磁力|磁石の力","はなれていてもはたらく力です。"],["w","力のはたらき","力の大きさの単位をカタカナで書きなさい。","ニュートン|n","単位はニュートン（記号N）です。"],["w","力のはたらき","質量100gの物体にはたらく重力の大きさは約何Nですか。数字で答えなさい。","1","100gの物体にはたらく重力を約1Nとします。","n"],["w","力のはたらき","質量300gの物体にはたらく重力の大きさは約何Nですか。数字で答えなさい。","3","100gで約1Nなので、300gでは約3Nです。","n"],["w","力のはたらき","力がはたらいている点を何といいますか。","作用点","矢印の始点で表します。"],["w","力のはたらき","力を矢印で表すとき、矢印の長さは力の何を表していますか。","大きさ|力の大きさ","矢印の長さが力の大きさ、向きが力の向き、始点が作用点です。"],["w","力のはたらき","1Nを1cmの矢印で表すとき、5Nの力は何cmの矢印になりますか。数字で答えなさい。","5","1N＝1cmなので5Nは5cmです。","cm"],["w","力のはたらき","ばねののびは、ばねを引く力の大きさに比例します。この関係を何といいますか。","フックの法則","イギリスのフックが発見した法則です。"],["w","力のはたらき","1Nの力で2cmのびるばねを3Nの力で引くと、何cmのびますか。数字で答えなさい。","6","のびは力に比例するので、2×3＝6（cm）です。","cm"],["w","力のはたらき","0.5Nの力で1cmのびるばねが4cmのびました。ばねを引いた力は何Nですか。数字で答えなさい。","2","1cmあたり0.5Nなので、0.5×4＝2（N）です。","n"],["w","力のはたらき","2力がつり合う条件は、一直線上にあり、大きさが等しく、向きが（　）であることです。（　）に入る言葉を書きなさい。","反対|逆|反対向き|逆向き","2力が一直線上・同じ大きさ・反対向きのとき、つり合います。"],["w","力のはたらき","机の上に置いた本にはたらく重力とつり合っている力は何ですか。","垂直抗力","下向きの重力と、机がおし返す上向きの垂直抗力がつり合っています。"],["w","力のはたらき","重力は地球の何に向かってはたらきますか。","中心|地球の中心","重力は地球の中心に向かってはたらきます。"],["w","力のはたらき","月面上で物体の重さは、地球上のおよそ何分の1になりますか。数字で答えなさい（〇分の1の〇）。","6","月の重力は地球の約6分の1です。"],["w","力のはたらき","地球上で質量600gの物体を月面上に持っていくと、質量は何gですか。数字で答えなさい。","600","質量は場所が変わっても変わりません。","g"],["w","力のはたらき","ばねばかりではかることができるのは、質量と重さ（物体にはたらく重力）のどちらですか。","重さ|重力","ばねばかりは力の大きさ（重さ）をはかります。質量は上皿てんびんではかります。"],["w","火山","地下の岩石が高温でどろどろにとけたものを何といいますか。","マグマ","マグマが地表に出てくると火山の噴火が起こります。"],["w","火山","マグマが地表に流れ出たものを何といいますか。","溶岩","冷えて固まったものも溶岩とよびます。"],["w","火山","火山灰・軽石・火山弾など、火山の噴火によってふき出されたものをまとめて何といいますか。","火山噴出物","火山灰・火山弾・軽石・溶岩などが火山噴出物です。"],["w","火山","ねばりけの強いマグマでできる、おわんをふせたような形を何状といいますか。カタカナ3字で答えなさい。","ドーム|ドーム状","ねばりけが強いと流れにくく、もり上がった形になります（昭和新山など）。"],["w","火山","ねばりけの弱いマグマでできる火山は、傾斜が急ですか、ゆるやかですか。","ゆるやか|緩やか","流れやすいので、うすく広がった形になります（マウナロアなど）。"],["w","火山","富士山のような円錐形の火山のマグマのねばりけは、強い・弱い・中間のどれですか。","中間","ねばりけが中間のマグマで、溶岩と火山灰が交互に積み重なってできます。"],["w","火山","ねばりけの強いマグマの溶岩は、白っぽいですか、黒っぽいですか。","白っぽい","ねばりけが強いと爆発的な噴火になり、溶岩は白っぽくなります。"],["w","火山","マグマが冷えて固まった岩石を何といいますか。","火成岩","火成岩は火山岩と深成岩に分けられます。"],["w","火山","マグマが地表や地表付近で急に冷えて固まった岩石を何といいますか。","火山岩","急に冷えるので大きな結晶が育ちません。"],["w","火山","マグマが地下深くでゆっくり冷えて固まった岩石を何といいますか。","深成岩","ゆっくり冷えるので大きな結晶が育ちます。"],["w","火山","火山岩に見られる、大きな結晶が細かい粒の中に散らばったつくりを何といいますか。","斑状組織","大きな結晶を斑晶、細かい粒の部分を石基といいます。"],["w","火山","深成岩に見られる、大きな結晶がすき間なく組み合わさったつくりを何といいますか。","等粒状組織","ゆっくり冷えて結晶が大きく育ったつくりです。"],["w","火山","斑状組織で、大きな結晶の部分を何といいますか。","斑晶","まわりの細かい粒の部分は石基です。"],["w","火山","斑状組織で、斑晶のまわりの細かい粒やガラス質の部分を何といいますか。","石基","マグマが急に冷えてできた部分です。"],["w","火山","火山岩のうち、流紋岩と玄武岩の中間の色をした岩石は何ですか。","安山岩","火山岩は流紋岩・安山岩・玄武岩です。"],["w","火山","深成岩のうち、花こう岩と斑れい岩の中間の色をした岩石は何ですか。","せん緑岩|閃緑岩","深成岩は花こう岩・せん緑岩・斑れい岩です。"],["w","火山","白っぽい色をした深成岩を何といいますか。","花こう岩|花崗岩","石英や長石を多くふくみ、白っぽく見えます。"],["w","火山","黒っぽい色をした火山岩を何といいますか。","玄武岩","有色鉱物を多くふくみ、黒っぽく見えます。"],["w","火山","無色鉱物のうち、無色や白色で、不規則に割れる鉱物は何ですか。","石英","無色鉱物は石英と長石です。"],["w","火山","黒色で、板状にうすくはがれる有色鉱物は何ですか。","黒雲母|くろうんも","黒雲母は板状でうすくはがれます。"],["w","火山","火山の地下の熱を利用した発電を何といいますか。","地熱発電","火山の熱は温泉や地熱発電に利用されています。"],["w","地震","地震が発生した地下の場所を何といいますか。","震源","地震のゆれは震源から広がります。"],["w","地震","震源の真上にある地表の地点を何といいますか。","震央","地図上では震央を×などで示します。"],["w","地震","地震のゆれで、はじめに起こる小さなゆれを何といいますか。","初期微動","P波によって起こるゆれです。"],["w","地震","初期微動のあとに続く大きなゆれを何といいますか。","主要動","S波によって起こるゆれです。"],["w","地震","初期微動を起こす、速く伝わる波を何といいますか。アルファベットを使って答えなさい。","p波|p","P波は速く伝わる波です。"],["w","地震","主要動を起こす波を何といいますか。アルファベットを使って答えなさい。","s波|s","S波はP波よりおそく伝わります。"],["w","地震","P波が届いてからS波が届くまでの時間（初期微動が続く時間）を何といいますか。","初期微動継続時間","震源からの距離が遠いほど長くなります。"],["w","地震","震源からの距離が遠いほど、初期微動継続時間は長くなりますか、短くなりますか。","長くなる|長く","P波とS波の到着時刻の差が大きくなるので長くなります。"],["w","地震","ある地点での地震のゆれの大きさを表すものを何といいますか。","震度","日本では気象庁の震度階級を使います。"],["w","地震","日本の震度階級は何段階ですか。数字で答えなさい。","10","0・1・2・3・4・5弱・5強・6弱・6強・7の10段階です。","段階"],["w","地震","地震そのものの規模（エネルギーの大きさ）を表すものを何といいますか。","マグニチュード","記号はMで表します。"],["w","地震","マグニチュードが1大きくなると、地震のエネルギーはおよそ何倍になりますか。数字で答えなさい。","32","マグニチュードが1大きいとエネルギーは約32倍、2大きいと約1000倍です。","倍"],["w","地震","地球の表面をおおう、厚さ100kmほどの岩盤を何といいますか。","プレート","日本付近には4つのプレートがあります。"],["w","地震","日本付近にあるプレートの数はいくつですか。数字で答えなさい。","4","太平洋・フィリピン海・北アメリカ・ユーラシアの4つです。","つ"],["w","地震","海洋プレートが大陸プレートの下にしずみこむところで起こる地震を何といいますか。","海溝型地震|海溝型","大陸プレートが引きずりこまれ、はね上がって起こります。"],["w","地震","東北地方の太平洋沖にある海溝を何といいますか。","日本海溝","太平洋プレートが北アメリカプレートの下にしずみこんでいます。"],["w","地震","地下の岩盤が大きな力を受けて割れ、ずれた部分を何といいますか。","断層","断層ができるときに地震が起こります。"],["w","地震","過去にくり返し活動し、今後も活動する可能性がある断層を何といいますか。","活断層","内陸型地震の原因になります。"],["w","地震","海底で大きな地震が起こったときに発生する、大きな波を何といいますか。","津波","海岸に押し寄せて大きな被害をもたらします。"],["w","地震","地震のゆれで、地面が液体のようにやわらかくなる現象を何といいますか。","液状化|液状化現象","うめ立て地などで起こりやすい現象です。"],["w","地震","地震などによって土地がもち上がることを何といいますか。","隆起","反対に土地がしずむことを沈降といいます。"],["w","地震","地震などによって土地がしずむことを何といいますか。","沈降","リアス海岸は土地の沈降でできます。"],["w","地震","緊急地震速報は、P波とS波のどちらをとらえて知らせるしくみですか。","p波|p","速いP波を観測して、大きなゆれ（S波）が来る前に知らせます。"],["w","地震","P波の速さが6km/sのとき、震源から60km離れた地点にP波が届くのは地震発生の何秒後ですか。数字で答えなさい。","10","60÷6＝10（秒後）です。","秒後"],["w","地震","P波の速さ7km/s、S波の速さ4km/sのとき、震源から84kmの地点の初期微動継続時間は何秒ですか。数字で答えなさい。","9","P波は84÷7＝12秒後、S波は84÷4＝21秒後に届くので、21－12＝9（秒）です。","秒"],["w","地層","岩石が気温の変化や水のはたらきで、表面からもろくくずれていくことを何といいますか。","風化","風化した岩石は流水によって運ばれます。"],["w","地層","流れる水が岩石や土をけずるはたらきを何といいますか。","侵食","川の上流では侵食のはたらきが大きいです。"],["w","地層","流れる水がけずった土砂を運ぶはたらきを何といいますか。","運搬","流れが速いほど大きな粒を運びます。"],["w","地層","運ばれた土砂が流れのゆるやかな所に積もるはたらきを何といいますか。","堆積","堆積が続いて地層ができます。"],["w","地層","河口から海に運ばれた土砂で、れき・砂・泥のうち河口の近くに積もりやすいのはどれですか。","れき|礫","粒の大きいれきは重いので河口近くに、泥は遠くに積もります。"],["w","地層","れき・砂・泥は、粒の何で区別されていますか。","大きさ|粒の大きさ","粒の大きさが2mm以上をれき、2〜0.06mmを砂、0.06mm以下を泥とします。"],["w","地層","堆積物が長い年月の間におし固められてできた岩石を何といいますか。","堆積岩","れき岩・砂岩・泥岩・石灰岩・チャート・凝灰岩などがあります。"],["w","地層","れき岩や砂岩の粒が丸みを帯びているのは、何によって運ばれる間に角がけずられたからですか。漢字2字で答えなさい。","流水","流れる水によって運ばれる間に角がとれて丸くなります。"],["w","地層","石灰岩にうすい塩酸をかけると発生する気体は何ですか。","二酸化炭素|co2","石灰岩の主成分は炭酸カルシウムなので、二酸化炭素が出ます。"],["w","地層","とてもかたく、うすい塩酸をかけても気体が出ない堆積岩を何といいますか。","チャート","チャートは非常にかたく、塩酸をかけても反応しません。"],["w","地層","火山灰などの火山噴出物が積もって固まった岩石を何といいますか。","凝灰岩","凝灰岩の層があると、当時火山の噴火があったことがわかります。"],["w","地層","生物の死がいなどが積もってできた堆積岩のうち、うすい塩酸をかけると二酸化炭素が出るものは何ですか。","石灰岩","サンゴや貝・放散虫などの死がいが積もってできます。"],["w","地層","地層ができた当時の環境を知る手がかりになる化石を何といいますか。","示相化石","サンゴの化石などがあります。"],["w","地層","地層ができた時代を知る手がかりになる化石を何といいますか。","示準化石","アンモナイトやサンヨウチュウの化石などがあります。"],["w","地層","サンゴの化石が見つかった地層は、当時あたたかくて深い海と浅い海のどちらだったと考えられますか。","浅い海|浅い","サンゴはあたたかく浅い海にすみます。"],["w","地層","アンモナイトの化石が見つかった地層は、何という地質年代にできたと考えられますか。","中生代","アンモナイトや恐竜は中生代の示準化石です。"],["w","地層","サンヨウチュウの化石が見つかった地層は、何という地質年代にできたと考えられますか。","古生代","サンヨウチュウやフズリナは古生代の示準化石です。"],["w","地層","ビカリアの化石が見つかった地層は、何という地質年代にできたと考えられますか。","新生代","ビカリアやナウマンゾウは新生代の示準化石です。"],["w","地層","示準化石になる生物は、栄えた期間が長いですか、短いですか。","短い","広い範囲に短い期間だけすんでいた生物が、時代を知る手がかりになります。"],["w","地層","地層の重なりで、ふつう下の層と上の層のどちらが古いですか。","下の層|下","地層は下から順に積もるので、下ほど古くなります。"],["w","地層","地層が大きな力を受けて、波打つように曲がったものを何といいますか。","しゅう曲|褶曲","左右から大きな力でおされてできます。"],["w","地層","地層の重なり方を柱のような図に表したものを何といいますか。","柱状図","はなれた場所の地層をくらべるときに使います。"],["w","地層","はなれた地域の地層をくらべるときに目印になる、火山灰の層などを何といいますか。","かぎ層|鍵層","火山灰の層は広い範囲に同時に積もるので目印になります。"],["w","地層","ある地層で、下から泥→砂→れきの順に粒が大きくなっていました。この間に海の深さはどう変化したと考えられますか。","浅くなった|浅くなる|浅く","粒が大きくなったのは河口（陸）に近くなったからで、海は浅くなったと考えられます。"]];

/* 数学：問題を自動で作る（数字が毎回変わるので、何回でも練習できる） */
const MATH = (()=>{
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RN=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const N=n=>n<0?"−"+(-n):""+n;            // 表示用の数
const P=n=>n<0?"("+N(n)+")":N(n);          // 負の数はかっこ
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function term(c,v,first){ // 係数cの項（v=""なら定数）
  if(c===0) return "";
  const abs=Math.abs(c), sign=c<0?"−":(first?"":"＋");
  const body = v ? (abs===1?v:abs+v) : ""+abs;
  return sign+body;
}
function lin(a,b,v="x"){ const s=term(a,v,true)+term(b,"",a===0); return s||"0"; }
function linAlt(a,b,v="x"){ if(a===0||b===0) return null; return term(b,"",true)+term(a,v,false); }
const W=(u,q,ans,e,alt)=>({t:"w",u,q,a:[].concat(ans).filter(Boolean).map(String),e,k:"m",un:alt||""});
const WJ=(u,q,ans,e)=>({t:"w",u,q,a:ans.split("|"),e,k:"j",un:""});
const ansLin=(a,b,v)=>[lin(a,b,v),linAlt(a,b,v)];

/* ---- 正の数・負の数 ---- */
const g = {
add(){const a=RN(-15,15),b=RN(-15,15);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}＋${P(b)}`,N(a+b).replace("−","-"),`${P(a)}＋${P(b)}＝${N(a+b)}。符号が同じなら絶対値の和に共通の符号、ちがうなら絶対値の差に絶対値の大きい方の符号をつけます。`)},
sub(){const a=RN(-15,15),b=RN(-15,15);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}−${P(b)}`,String(a-b),`ひく数の符号を変えて加法にします。${P(a)}＋${P(-b)}＝${N(a-b)}。`)},
add3(){const a=RN(-12,12),b=RN(-12,12),c=RN(-12,12);return W("正の数・負の数",`次の計算をしなさい。\n${N(a)}${b<0?"−"+(-b):"＋"+b}${c<0?"−"+(-c):"＋"+c}`,String(a+b+c),`正の項どうし、負の項どうしをまとめてから計算します。答えは ${N(a+b+c)}。`)},
abs(){const a=RN(-30,30);return W("正の数・負の数",`${N(a)} の絶対値を答えなさい。`,String(Math.abs(a)),`絶対値は数直線上で0からの距離なので、符号をとった ${Math.abs(a)} です。`)},
cmp(){const s=new Set();while(s.size<4)s.add(R(-9,9));const arr=[...s];const mn=Math.min(...arr);return W("正の数・負の数",`次の数のうち、最も小さい数を答えなさい。\n${arr.map(N).join("、")}`,String(mn),`負の数は絶対値が大きいほど小さくなります。最も小さいのは ${N(mn)}。`)},
mul(){const a=RN(-9,9),b=RN(-9,9);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}×${P(b)}`,String(a*b),`同じ符号の積は正、ちがう符号の積は負。${P(a)}×${P(b)}＝${N(a*b)}。`)},
div(){const b=RN(-9,9),q=RN(-9,9),a=b*q;return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}÷${P(b)}`,String(q),`符号のきまりは乗法と同じです。${P(a)}÷${P(b)}＝${N(q)}。`)},
pow(){const t=R(0,2);let a,q,ans,e;
 if(t===0){a=R(2,9);q=`(−${a})²`;ans=a*a;e=`(−${a})×(−${a})＝${ans}。負の数どうしの積なので正になります。`}
 else if(t===1){a=R(2,9);q=`−${a}²`;ans=-a*a;e=`−(${a}×${a})＝${N(ans)}。2乗するのは ${a} だけで、その前に − がつきます。`}
 else{a=R(2,4);q=`(−${a})³`;ans=-a*a*a;e=`(−${a})×(−${a})×(−${a})＝${N(ans)}。負の数を3個かけるので負になります。`}
 return W("正の数・負の数",`次の計算をしなさい。\n${q}`,String(ans),e)},
mix(){const t=R(0,2);const a=RN(-10,10),b=RN(-6,6),c=RN(-6,6);let q,ans,e;
 if(t===0){q=`${N(a)}＋${P(b)}×${P(c)}`;ans=a+b*c;e=`乗法を先に計算します。${P(b)}×${P(c)}＝${N(b*c)}、${N(a)}＋${P(b*c)}＝${N(ans)}。`}
 else if(t===1){const d=b*c;q=`${N(a)}−${P(d)}÷${P(c)}`;ans=a-b;e=`除法を先に計算します。${P(d)}÷${P(c)}＝${N(b)}、${N(a)}−${P(b)}＝${N(ans)}。`}
 else{q=`${P(b)}×(${N(a)}＋${P(c)})`;ans=b*(a+c);e=`かっこの中を先に計算します。${N(a)}＋${P(c)}＝${N(a+c)}、${P(b)}×${P(a+c)}＝${N(ans)}。`}
 return W("正の数・負の数",`次の計算をしなさい。\n${q}`,String(ans),e)},

/* ---- 文字の式 ---- */
express(){const t=R(0,4);let q,ans,e;
 if(t===0){const k=RN(-9,9);const v=pick(["ab","xy","ac"]);q=`${v[0]}×${v[1]}×${P(k)}`;ans=term(k,v,true);e=`数を文字の前に書き、×は省きます。文字はアルファベット順にします。答えは ${ans}。`}
 else if(t===1){const v=pick(["x","a","y"]);q=`${v}×(−1)`;ans="−"+v;e=`−1と文字の積は 1 を省いて −${v} と書きます。`}
 else if(t===2){const k=R(2,9);const v=pick(["a","x"]);q=`${v}÷${k}`;ans=`${v}/${k}`;e=`÷は使わず分数で表します。${v}/${k}（${k}分の${v}）です。`}
 else if(t===3){const v=pick(["x","a"]);const w=pick(["y","b"]);q=`${v}×${v}×${w}`;ans=`${v}^2${w}`;e=`同じ文字の積は累乗の指数を使います。${v}²${w} です。`}
 else{const a=R(2,9),b=R(2,9);q=`${a}×x−y×${b}`;ans=`${a}x−${b}y`;e=`数を文字の前に書き、×を省いて ${a}x−${b}y。`}
 return W("文字の式",`次の式を、文字式の表し方にしたがって書きなさい。\n${q}`,[ans],e)},
value(){const x=RN(-5,5),t=R(0,2);let q,ans,e;
 if(t===0){const a=RN(-6,6),b=RN(-9,9);q=`${lin(a,b)}`;ans=a*x+b;e=`x に ${P(x)} を代入します。${N(a)}×${P(x)}${b<0?"−"+(-b):"＋"+b}＝${N(ans)}。`}
 else if(t===1){const b=RN(-6,6);q=`x²${term(b,"x",false)}`;ans=x*x+b*x;e=`x²＝${P(x)}²＝${x*x}、${b}x＝${b}×${P(x)}＝${N(b*x)}。合わせて ${N(ans)}。`}
 else{q=`−x²`;ans=-x*x;e=`−x²＝−(${P(x)}²)＝${N(ans)}。2乗してから − をつけます。`}
 return W("文字の式",`x＝${N(x)} のとき、次の式の値を求めなさい。\n${q}`,String(ans),e)},
linAdd(){const a=RN(-9,9),b=RN(-9,9),c=RN(-9,9),d=RN(-9,9);return W("文字の式",`次の計算をしなさい。\n(${lin(a,b)})＋(${lin(c,d)})`,ansLin(a+c,b+d),`かっこをはずして、x の項どうし、数の項どうしをまとめます。${a}x${term(c,"x",false)}${term(b,"",false)}${term(d,"",false)}＝${lin(a+c,b+d)}。`)},
linSub(){const a=RN(-9,9),b=RN(-9,9),c=RN(-9,9),d=RN(-9,9);return W("文字の式",`次の計算をしなさい。\n(${lin(a,b)})−(${lin(c,d)})`,ansLin(a-c,b-d),`ひくほうのかっこの中の符号をすべて変えてからまとめます。(${lin(a,b)})＋(${lin(-c,-d)})＝${lin(a-c,b-d)}。`)},

 1:["add","add","sub","sub","add3","abs","cmp","mul","div","pow","mix"],
 2:["mix","mix","pow","mul","div","express","express","value","value","linAdd","linSub","wordExpr"],
 3:["linAdd","linSub","mulK","divK","dist2","value","eq1","eq2","eq2","eq3","eq3","eqParen","eqFrac","eqDec","ratio","word1","word2","word3","word4","eqTerm"],
 4:["eq3","eqParen","word1","word2","word4","ratio","propA","propA","propV","propV","invA","invV","propTerm","propTerm"],
 5:["invA","invV","arc","sector","circle","cyl","cone","pyr","prism","geoTerm","geoTerm","rel","dataTerm","dataTerm"]
};

function make(termId,count){
  const list=TERMMAP[termId], out=[], seen=new Set();
  let guard=0;
  while(out.length<count && guard<count*20){
    guard++;
    const q=g[pick(list)]();
    if(seen.has(q.q)) continue;
    seen.add(q.q); out.push(q);
  }
  return out;
}
return {make, TERMMAP};

function pool(subjId,termId){
  const rows=(DATA[subjId]&&DATA[subjId][termId])||[];

  return rows.map(r=>({t:r[0],u:r[1],q:r[2],a:r[3].split("|"),e:r[4],un:r[5]||"",k}));
}

/* ===== 採点 ===== */
function norm(s,k){
  s=String(s).normalize("NFKC").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  if(k==="m"){return s.replace(/[−‐‑–—―ー－]/g,"-").replace(/[\s^*]/g,"");}
  if(k==="e"){return s.replace(/[.,!?。、]/g," ").replace(/\s+/g," ").trim();}
  s=s.replace(/[\s、。，・「」『』]/g,"").replace(/[.]$/,"");
  return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
function judge(q,input){
  const u=norm(input,q.k); if(!u) return false;
  return q.a.some(a=>{const n=norm(a,q.k);return u===n||(q.un&&u===norm(a+q.un,q.k));});
}

    <div class="panel top">
      <h2>どのテスト？</h2>
      <div class="seg" id="terms">${TERMS.filter(t=>t.id>=3).map(t=>`<button aria-pressed="${t.id===S.term}" data-t="${t.id}">${t.name}</button>`).join("")}</div>
      <p class="hint">${ok?(s.gen?"数学は数字が毎回変わる問題を自動で作ります。":`この時期の問題は ${size} 問あります。毎回シャッフルして出題します。`):"この時期の問題はまだ入っていません。"}</p>
    </div>
    <div class="panel">
      <h2>問題数</h2>
      <div class="seg" id="cnt">${[10,25,50].map(n=>`<button aria-pressed="${n===S.count}" data-n="${n}">${n}問</button>`).join("")}</div>
    </div>
    <button class="btn" id="go" ${ok?"":"disabled"}>スタート</button>`;
  document.getElementById("bk").onclick=()=>{S.subj=null;S.screen="home";render();};
  app.querySelectorAll("#terms button").forEach(b=>b.onclick=()=>{S.term=+b.dataset.t;renderSetup();});
  app.querySelectorAll("#cnt button").forEach(b=>b.onclick=()=>{S.count=+b.dataset.n;renderSetup();});
  document.getElementById("go").onclick=start;
}

function start(){
  const s=S.subj;
  let qs = s.gen ? MATH.make(S.term,S.count) : shuffle(pool(s.id,S.term)).slice(0,S.count);
  S.qs=qs.map(prep); S.idx=0; S.res=[]; S.pad={ans:{idx:-1,data:null},memo:{idx:-1,data:null}}; S.screen="quiz"; render();
}
function prep(q){
  if(q.t==="c"){const order=shuffle([0,1,2,3].slice(0,q.a.length));return {...q,choices:order.map(i=>q.a[i]),ans:order.indexOf(0)};}
  return {...q};
}

const disp=(q,v)=>q.k==="m"?String(v).replace(/\^2/g,"²").replace(/\^3/g,"³").replace(/-/g,"−"):String(v);
/* ===== 手書きパッド（回答欄・計算メモ） ===== */
const MEMO_SUBJ=["sugaku","rika"];
S.tool={ans:"pen",memo:"pen"}; S.pad={ans:{idx:-1,data:null},memo:{idx:-1,data:null}};

function padHTML(id,title,h){
  return `<div class="pad" data-pad="${id}">
    <div class="padBar"><span class="padTitle">${title}</span>
      <span class="padTools"><button data-tool="pen" aria-pressed="${S.tool[id]==="pen"}">ペン</button><button data-tool="eraser" aria-pressed="${S.tool[id]==="eraser"}">消しゴム</button><button data-tool="clear">全部消す</button></span></div>
    <canvas id="pad-${id}" style="height:${h}px" aria-label="${title}（指やペンで書けます）"></canvas>
  </div>`;
}
function savePads(){ // 再表示の前に、同じ問題のパッドの内容を保存
  for(const id of ["ans","memo"]){
    const cv=document.getElementById("pad-"+id);
    if(cv&&S.pad[id].idx===S.idx){try{S.pad[id].data=cv.toDataURL()}catch(e){}}
    if(S.pad[id].idx!==S.idx){S.pad[id]={idx:S.idx,data:null};}
  }
}
function setupPad(id,locked){
  const cv=document.getElementById("pad-"+id); if(!cv) return null;
  const box=cv.closest(".pad"); if(locked) box.classList.add("locked");
  const dpr=Math.max(1,window.devicePixelRatio||1), w=cv.clientWidth, h=cv.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineCap="round"; ctx.lineJoin="round";
  cv.dataset.inked = S.pad[id].data ? "1" : "";
  if(S.pad[id].data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,w,h);img.src=S.pad[id].data;}
  if(locked) return cv;
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#1E2A44";
  let drawing=false,lx=0,ly=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const thick = id==="ans" ? 4 : 2.6;
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;[lx,ly]=pos(e);
    const er=S.tool[id]==="eraser";
    ctx.globalCompositeOperation=er?"destination-out":"source-over";
    ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineWidth=er?24:thick;
    ctx.beginPath();ctx.arc(lx,ly,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();
    if(!er) cv.dataset.inked="1";});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y;});
  const end=()=>{drawing=false};
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,end));
  box.querySelectorAll(".padTools button").forEach(b=>b.onclick=()=>{
    const t=b.dataset.tool;
    if(t==="clear"){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();S.pad[id].data=null;cv.dataset.inked="";return;}
    S.tool[id]=t; box.querySelectorAll(".padTools button[data-tool=pen],.padTools button[data-tool=eraser]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===t));
  });
  return cv;
}

/* ===== 出題 ===== */
function renderQuiz(){
  savePads();
  const q=S.qs[S.idx], n=S.qs.length, r=S.res[S.idx], shown=!!(r&&r.shown);
  const useMemo=MEMO_SUBJ.includes(S.subj.id);
  const unit=q.un&&/^[\d.\-−]+$/.test(q.a[0])?" "+q.un.replace("cm3","cm³").replace("hz","Hz"):"";
  const alts=q.a.slice(1);
  app.innerHTML=`
    <div class="progress"><span>${S.subj.name}・${termName(S.term)}</span><span>${S.idx+1} / ${n}</span></div>
    <div class="bar"><i style="width:${S.idx/n*100}%"></i></div>
    <div class="panel top">
      <span class="unitTag">${esc(q.u)}</span>
      <p class="q">${esc(q.q)}</p>
      ${useMemo?padHTML("memo","計算メモ",240):""}
      ${padHTML("ans","答えを書く",170)}
      ${shown?`
        <div class="answerBox">
          <div class="answerLabel">模範解答</div>
          <div class="answerMain">${esc(disp(q,q.a[0]))}${esc(unit)}</div>
          ${alts.length?`<div class="hint">（${alts.map(x=>esc(disp(q,x))).join("／")} でも正解）</div>`:""}
          <div class="exp">${esc(q.e)}</div>
        </div>
        <p class="ask">自分の答えは合っていましたか？</p>
        <div class="grade">
          <button class="gbtn ok" id="ok">○ 正解</button>
          <button class="gbtn ng" id="ng">× まちがい</button>
        </div>`
      :`<button class="btn" id="check">答え合わせ</button><p class="hint" id="warn"></p>`}
      <button class="link quit" id="quit">ここでやめて結果を見る</button>
    </div>`;
  setupPad("memo",false);
  const ansCv=setupPad("ans",shown);
  if(!shown){
    document.getElementById("check").onclick=()=>{
      if(!ansCv.dataset.inked){document.getElementById("warn").textContent="答えを書いてから押してください。";return;}
      let img=null; try{img=ansCv.toDataURL()}catch(e){}
      S.res[S.idx]={shown:true,img}; renderQuiz();
      const g=document.querySelector(".answerBox"); if(g) g.scrollIntoView({behavior:"smooth",block:"start"});
    };
  }else{
    const go=ok=>{S.res[S.idx].ok=ok; if(S.idx+1<n){S.idx++;render();}else finish();};
    document.getElementById("ok").onclick=()=>go(true);
    document.getElementById("ng").onclick=()=>go(false);
  }
  document.getElementById("quit").onclick=()=>{
    const done=S.res.filter(x=>x&&x.ok!==undefined).length;
    if(done===0){S.screen="setup";render();return}
    S.qs=S.qs.slice(0,done); S.res=S.res.slice(0,done); finish();
  };
}

function finish(){
  const n=S.qs.length, ok=S.res.slice(0,n).filter(r=>r&&r.ok).length;
  const st=load("chu1-stats2",{}), key=S.subj.id+"-"+S.term, cur=st[key]||{n:0,ok:0};
  cur.n+=n; cur.ok+=ok; st[key]=cur; save("chu1-stats2",st);
  S.screen="result"; render();
}

function renderResult(){
  const n=S.qs.length, ok=S.res.slice(0,n).filter(r=>r&&r.ok).length;
  const wrong=S.qs.filter((q,i)=>!(S.res[i]&&S.res[i].ok));
  app.innerHTML=`
    <div class="panel top" style="text-align:center">
      <h2>${S.subj.name}の結果</h2>
      <div class="big">${ok}<span style="font-size:1.4rem"> / ${n}</span></div>
      <p class="lead" style="margin:0">${ok===n?"全問正解！この調子です。":ok>=n*0.8?"よくできました。まちがえた問題を見直そう。":"まちがえた問題の解説を読んで、もう一度チャレンジしよう。"}</p>
    </div>
    ${wrong.length?`<button class="btn" id="retry">まちがえた ${wrong.length} 問だけもう一度</button>`:""}
    <button class="btn ${wrong.length?"ghost":""}" id="again">もう一回（新しくシャッフル）</button>
    <button class="btn ghost" id="home">教科えらびにもどる</button>
    <div class="panel">
      <h2>ふりかえり</h2>
      ${S.qs.map((q,i)=>{const r=S.res[i]||{};const right=r.ok;
        return `<div class="review">
          <div><span class="mk" style="color:${right?"var(--ok)":"var(--ng)"}">${right?"○":"×"}</span><b>${esc(q.q)}</b></div>
          <div class="hint">模範解答：${esc(disp(q,q.a[0]))}</div>
          ${right?"":`${r.img?`<div class="hint">あなたの答え：</div><img class="myAns" src="${r.img}" alt="あなたの手書きの答え">`:""}<div class="exp" style="margin-top:6px">${esc(q.e)}</div>`}
        </div>`}).join("")}
    </div>`;
  const rb=document.getElementById("retry");
  if(rb) rb.onclick=()=>{S.qs=shuffle(wrong).map(prep);S.idx=0;S.res=[];S.pad={ans:{idx:-1,data:null},memo:{idx:-1,data:null}};S.screen="quiz";render();};
  document.getElementById("again").onclick=()=>{S.pad={ans:{idx:-1,data:null},memo:{idx:-1,data:null}};start();};
  document.getElementById("home").onclick=()=>{S.subj=null;S.screen="home";render();};
}

render();

</script>
</body>
</html>

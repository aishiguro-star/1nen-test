<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6FD6">
<title>中1 テスト対策ドリル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FD; --grid:#DCE6F3; --ink:#1E2A44; --sub:#5B6782; --line:#C9D5E6; --card:#FFFFFF;
  --ok:#1F9D57; --ng:#D9463E;
  --kokugo:#D9463E; --sugaku:#2F6FD6; --rika:#2E9E5B; --shakai:#D9821A; --eigo:#8A4FD0;
  --accent:var(--sugaku);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131926; --grid:#1D2638; --ink:#E7EDF7; --sub:#9AA7C0; --line:#2C3850; --card:#1A2232;
    --ok:#3CC57A; --ng:#F06A62;
    --kokugo:#F06A62; --sugaku:#5C93F0; --rika:#4CC27F; --shakai:#F0A04A; --eigo:#AC7DEB;
  }
}
:root[data-theme="dark"]{
  --paper:#131926; --grid:#1D2638; --ink:#E7EDF7; --sub:#9AA7C0; --line:#2C3850; --card:#1A2232;
  --ok:#3CC57A; --ng:#F06A62;
  --kokugo:#F06A62; --sugaku:#5C93F0; --rika:#4CC27F; --shakai:#F0A04A; --eigo:#AC7DEB;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-weight:500;line-height:1.7;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.65rem;font-weight:900;margin:8px 0 2px;letter-spacing:.02em}
h2{font-size:1.2rem;font-weight:900;margin:0 0 12px}
.lead{color:var(--sub);margin:0 0 20px;font-size:.95rem}
.term{display:inline-block;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.9rem}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.subj{
  appearance:none;border:none;cursor:pointer;text-align:left;font:inherit;color:#fff;
  background:var(--c);border-radius:14px;padding:16px 16px 14px;min-height:104px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000);
  transition:transform .08s ease, box-shadow .08s ease;
}
.subj:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#000)}
.subj .k{font-size:1.9rem;font-weight:900;line-height:1.1}
.subj .s{font-size:.8rem;opacity:.92;margin-top:6px}
.subj.wide{grid-column:1 / -1;min-height:84px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel.top{border-top:6px solid var(--accent)}
.back{appearance:none;background:none;border:none;color:var(--sub);font:inherit;font-weight:700;padding:6px 0;cursor:pointer}
label.row{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
label.row:last-child{border-bottom:none}
label.row input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.grp{font-size:.82rem;color:var(--sub);font-weight:700;margin:12px 0 2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  appearance:none;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem
}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
textarea{
  width:100%;min-height:76px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:2px solid var(--line);border-radius:10px;padding:10px;resize:vertical
}
.hint{font-size:.8rem;color:var(--sub);margin:6px 0 0}
.btn{
  display:block;width:100%;appearance:none;border:none;cursor:pointer;font:inherit;font-weight:900;
  font-size:1.1rem;color:#fff;background:var(--accent);border-radius:14px;padding:15px;margin-top:18px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--sub);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.unitTag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:0 8px;margin-bottom:8px}
.q{font-size:1.08rem;font-weight:700;white-space:pre-wrap;margin:0 0 14px;overflow-wrap:anywhere}
.choices{display:grid;gap:10px}
.choice{
  appearance:none;text-align:left;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere
}
.choice b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-size:.85rem}
.choice.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.choice.correct b{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--card))}
.choice.wrong b{background:var(--ng);border-color:var(--ng);color:#fff}
.choice:disabled{cursor:default}
.verdict{font-size:1.3rem;font-weight:900;margin:16px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:var(--paper);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.big{font-size:3.4rem;font-weight:900;line-height:1;margin:8px 0}
.review{border-top:1px dashed var(--line);padding:12px 0}
.review:first-child{border-top:none}
.review .mk{font-weight:900;margin-right:6px}
.loading{text-align:center;padding:30px 10px}
.pencil{display:inline-block;font-size:2.4rem;animation:wr 1.2s ease-in-out infinite}
@keyframes wr{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}.bar i{transition:none}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stat{font-size:.8rem;color:var(--sub);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:2px 8px}
.notice{background:color-mix(in srgb,var(--ng) 10%,var(--card));border:2px solid var(--ng);border-radius:12px;padding:12px;margin-top:14px;font-size:.92rem}
.hidden{display:none !important}
.typeTag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--sub);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;margin-bottom:8px}
.write input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px}
.write input.okIn{border-color:var(--ok)} .write input.ngIn{border-color:var(--ng)}
.correct{margin:0 0 8px;font-weight:700}
.correct .hint{display:block;font-weight:500}
.link{appearance:none;background:none;border:none;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer;padding:10px 0 0;font-size:.9rem;display:block}
.link.quit{color:var(--sub);margin-top:14px;font-size:.82rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA={kokugo:{},sugaku:{},rika:{},shakai:{},eigo:{}};

DATA.kokugo[3] = [
["w","漢字の読み","「穏やか」の読みをひらがなで書きなさい。","おだやか","「穏」は「おだ（やか）」と読みます。音読みは「オン」（平穏）。"],
["w","漢字の読み","「僅か」の読みをひらがなで書きなさい。","わずか","「僅か」は「わずか」。ほんの少しという意味です。"],
["w","漢字の読み","「概略」の読みをひらがなで書きなさい。","がいりゃく","「概」は「ガイ」。概略は「だいたいのあらまし」という意味です。"],
["w","漢字の読み","「抑揚」の読みをひらがなで書きなさい。","よくよう","声の調子の上げ下げのことを「抑揚（よくよう）」といいます。"],
["w","漢字の読み","「繊細」の読みをひらがなで書きなさい。","せんさい","「繊」は「セン」。細やかでこわれやすい様子を表します。"],
["w","漢字の読み","「顕著」の読みをひらがなで書きなさい。","けんちょ","「顕」は「ケン」、「著」は「チョ」。はっきり目立つという意味です。"],
["w","漢字の読み","「慎重」の読みをひらがなで書きなさい。","しんちょう","「慎」は「シン」。注意深く行う様子です。"],
["w","漢字の読み","「鮮やか」の読みをひらがなで書きなさい。","あざやか","「鮮」の訓読みは「あざ（やか）」、音読みは「セン」（新鮮）です。"],
["w","漢字の読み","「把握」の読みをひらがなで書きなさい。","はあく","「把握」は「はあく」。しっかり理解することです。"],
["w","漢字の読み","「貢献」の読みをひらがなで書きなさい。","こうけん","「貢」は「コウ」、「献」は「ケン」。役に立つことをするという意味です。"],
["w","漢字の読み","「促す」の読みをひらがなで書きなさい。","うながす","「促」の訓読みは「うなが（す）」、音読みは「ソク」（促進）です。"],
["w","漢字の読み","「頻繁」の読みをひらがなで書きなさい。","ひんぱん","「頻繁」は「ひんぱん」。何度もくり返される様子です。"],
["w","漢字の読み","「遂げる」の読みをひらがなで書きなさい。","とげる","「遂」の訓読みは「と（げる）」、音読みは「スイ」（完遂）です。"],
["w","漢字の読み","「拒む」の読みをひらがなで書きなさい。","こばむ","「拒」の訓読みは「こば（む）」、音読みは「キョ」（拒否）です。"],
["w","漢字の読み","「譲歩」の読みをひらがなで書きなさい。","じょうほ","「譲」は「ジョウ」。自分の意見をおさえて相手にゆずることです。"],
["w","漢字の読み","「緩やか」の読みをひらがなで書きなさい。","ゆるやか","「緩」の訓読みは「ゆる（やか）」、音読みは「カン」（緩和）です。"],
["w","漢字の読み","「漂う」の読みをひらがなで書きなさい。","ただよう","「漂」の訓読みは「ただよ（う）」、音読みは「ヒョウ」（漂流）です。"],
["w","漢字の読み","「沈黙」の読みをひらがなで書きなさい。","ちんもく","「沈」は「チン」、「黙」は「モク」。だまっていることです。"],
["w","漢字の読み","「偏る」の読みをひらがなで書きなさい。","かたよる","「偏」の訓読みは「かたよ（る）」、音読みは「ヘン」（偏見）です。"],
["w","漢字の読み","「唐突」の読みをひらがなで書きなさい。","とうとつ","「唐突」は「とうとつ」。だしぬけで急な様子です。"],
["w","漢字の読み","「懸命」の読みをひらがなで書きなさい。","けんめい","「懸」は「ケン」。力のかぎりがんばる様子です。"],
["w","漢字の読み","「携える」の読みをひらがなで書きなさい。","たずさえる","「携」の訓読みは「たずさ（える）」、音読みは「ケイ」（携帯）です。"],
["w","漢字の読み","「朗らか」の読みをひらがなで書きなさい。","ほがらか","「朗」の訓読みは「ほが（らか）」、音読みは「ロウ」（朗読）です。"],
["w","漢字の読み","「惜しい」の読みをひらがなで書きなさい。","おしい","「惜」の訓読みは「お（しい）」、音読みは「セキ」（惜別）です。"],
["w","漢字の読み","「繁茂」の読みをひらがなで書きなさい。","はんも","草木がおいしげることを「繁茂（はんも）」といいます。"],
["w","漢字の書き","「カンタンな問題」のカタカナを漢字で書きなさい。","簡単","「簡単」。「単」を「短」と書かないよう注意。"],
["w","漢字の書き","「意見をノべる」のカタカナを漢字と送り仮名で書きなさい。","述べる","「述べる」。送り仮名は「べる」です。"],
["w","漢字の書き","「タンジュンな仕組み」のカタカナを漢字で書きなさい。","単純","「単純」。「純」は糸へんです。"],
["w","漢字の書き","「セイケツな服」のカタカナを漢字で書きなさい。","清潔","「清潔」。どちらもさんずいです。"],
["w","漢字の書き","「荷物をアズける」のカタカナを漢字と送り仮名で書きなさい。","預ける","「預ける」。送り仮名は「ける」です。"],
["w","漢字の書き","「ケイケンを積む」のカタカナを漢字で書きなさい。","経験","「経験」。「験」は馬へんです（「検」「険」と区別）。"],
["w","漢字の書き","「責任をハたす」のカタカナを漢字と送り仮名で書きなさい。","果たす","「果たす」。送り仮名は「たす」です。"],
["w","漢字の書き","「ヒョウジュンの大きさ」のカタカナを漢字で書きなさい。","標準","「標準」。「標」は木へんです。"],
["w","漢字の書き","「エイセイ管理に気をつける」のカタカナを漢字で書きなさい。","衛生","健康を守ることは「衛生」。人工の星は「衛星」なので区別します。"],
["w","漢字の書き","「列にナラぶ」のカタカナを漢字と送り仮名で書きなさい。","並ぶ","「並ぶ」。送り仮名は「ぶ」です。"],
["w","漢字の書き","「コンナンを乗りこえる」のカタカナを漢字で書きなさい。","困難","「困難」。「難」は「むずかしい」の意味です。"],
["w","漢字の書き","「失敗をミトめる」のカタカナを漢字と送り仮名で書きなさい。","認める","「認める」。送り仮名は「める」です。"],
["w","漢字の書き","「ギモンに思う」のカタカナを漢字で書きなさい。","疑問","「疑問」。「疑」は「うたが（う）」とも読みます。"],
["w","漢字の書き","「ユウシュウな成績」のカタカナを漢字で書きなさい。","優秀","「優秀」。「秀」は「ひい（でる）」とも読みます。"],
["w","漢字の書き","「答えをカクニンする」のカタカナを漢字で書きなさい。","確認","「確認」。「確」は石へんです。"],
["w","漢字の書き","「道にマヨう」のカタカナを漢字と送り仮名で書きなさい。","迷う","「迷う」。送り仮名は「う」です。"],
["w","漢字の書き","「毎日のドリョク」のカタカナを漢字で書きなさい。","努力","「努力」。「努」の下は「力」です。"],
["w","漢字の書き","「意見をソンチョウする」のカタカナを漢字で書きなさい。","尊重","「尊重」。大切にあつかうという意味です。"],
["w","漢字の書き","「今日はアタタかい日だ」のカタカナを漢字と送り仮名で書きなさい。","暖かい","気温には「暖かい」、物や心には「温かい」を使います。"],
["w","漢字の書き","「ユウビン局」のカタカナを漢字で書きなさい。","郵便","「郵便」。「郵」はおおざとです。"],
["w","漢字の書き","「シュクダイを出す」のカタカナを漢字で書きなさい。","宿題","「宿題」。"],
["w","漢字の書き","「会議をヒラく」のカタカナを漢字と送り仮名で書きなさい。","開く","「開く」。送り仮名は「く」です。"],
["w","漢字の書き","「イサギヨく負けを認める」のカタカナを漢字と送り仮名で書きなさい。","潔く","「潔い」の連用形で「潔く」。送り仮名に注意します。"],
["w","漢字の書き","「セイジツな人柄」のカタカナを漢字で書きなさい。","誠実","「誠実」。まじめで真心がある様子です。"],
["w","漢字の書き","「時間をハカる」のカタカナを漢字と送り仮名で書きなさい。","計る","時間は「計る」、長さは「測る」、重さは「量る」です。"],
["w","文法","「私は毎朝早く起きる。」はいくつの文節に分けられますか。数字で答えなさい。","4","私は／毎朝／早く／起きる　の4文節。「ネ」を入れて区切れるところが文節の切れ目です。"],
["w","文法","「庭に赤い花が咲いた。」はいくつの文節に分けられますか。数字で答えなさい。","4","庭に／赤い／花が／咲いた　の4文節です。"],
["w","文法","「弟が公園で遊んでいる。」はいくつの文節に分けられますか。数字で答えなさい。","4","弟が／公園で／遊んで／いる　の4文節。「遊んで」と「いる」は別の文節です（補助の関係）。"],
["w","文法","「明日は雨が降るらしい。」はいくつの文節に分けられますか。数字で答えなさい。","3","明日は／雨が／降るらしい　の3文節。「らしい」は付属語なので前の文節にふくまれます。"],
["w","文法","「大きな木の下で本を読んだ。」はいくつの文節に分けられますか。数字で答えなさい。","5","大きな／木の／下で／本を／読んだ　の5文節です。"],
["w","文法","「花が咲く。」はいくつの単語に分けられますか。数字で答えなさい。","3","花／が／咲く　の3単語。「が」は助詞で1単語です。"],
["w","文法","「私は本を読んだ。」はいくつの単語に分けられますか。数字で答えなさい。","6","私／は／本／を／読ん／だ　の6単語。「読んだ」は「読ん」と助動詞「だ」に分かれます。"],
["w","文法","「空がとても青い。」はいくつの単語に分けられますか。数字で答えなさい。","4","空／が／とても／青い　の4単語です。"],
["w","文法","「昨日、兄が駅で友達に会った。」の主語を文節で書きなさい。","兄が|兄","「だれが」にあたる「兄が」が主語です。"],

/* 数学：問題を自動で作る（数字が毎回変わるので、何回でも練習できる） */
const MATH = (()=>{
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RN=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const N=n=>n<0?"−"+(-n):""+n;            // 表示用の数
const P=n=>n<0?"("+N(n)+")":N(n);          // 負の数はかっこ
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function term(c,v,first){ // 係数cの項（v=""なら定数）
  if(c===0) return "";
  const abs=Math.abs(c), sign=c<0?"−":(first?"":"＋");
  const body = v ? (abs===1?v:abs+v) : ""+abs;
  return sign+body;
}
function lin(a,b,v="x"){ const s=term(a,v,true)+term(b,"",a===0); return s||"0"; }
function linAlt(a,b,v="x"){ if(a===0||b===0) return null; return term(b,"",true)+term(a,v,false); }
const W=(u,q,ans,e,alt)=>({t:"w",u,q,a:[].concat(ans).filter(Boolean).map(String),e,k:"m",un:alt||""});
const C=(u,q,choices,e)=>({t:"c",u,q,a:choices,e});
const ansLin=(a,b,v)=>[lin(a,b,v),linAlt(a,b,v)];

/* ---- 正の数・負の数 ---- */
const g = {
add(){const a=RN(-15,15),b=RN(-15,15);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}＋${P(b)}`,N(a+b).replace("−","-"),`${P(a)}＋${P(b)}＝${N(a+b)}。符号が同じなら絶対値の和に共通の符号、ちがうなら絶対値の差に絶対値の大きい方の符号をつけます。`)},
sub(){const a=RN(-15,15),b=RN(-15,15);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}−${P(b)}`,String(a-b),`ひく数の符号を変えて加法にします。${P(a)}＋${P(-b)}＝${N(a-b)}。`)},
add3(){const a=RN(-12,12),b=RN(-12,12),c=RN(-12,12);return W("正の数・負の数",`次の計算をしなさい。\n${N(a)}${b<0?"−"+(-b):"＋"+b}${c<0?"−"+(-c):"＋"+c}`,String(a+b+c),`正の項どうし、負の項どうしをまとめてから計算します。答えは ${N(a+b+c)}。`)},
abs(){const a=RN(-30,30);return W("正の数・負の数",`${N(a)} の絶対値を答えなさい。`,String(Math.abs(a)),`絶対値は数直線上で0からの距離なので、符号をとった ${Math.abs(a)} です。`)},
cmp(){const s=new Set();while(s.size<4)s.add(R(-9,9));const arr=[...s];const mn=Math.min(...arr);return C("正の数・負の数",`次の数のうち、最も小さい数はどれですか。\n${arr.map(N).join("、")}`,[N(mn),...arr.filter(x=>x!==mn).map(N)],`負の数は絶対値が大きいほど小さくなります。最も小さいのは ${N(mn)}。`)},
mul(){const a=RN(-9,9),b=RN(-9,9);return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}×${P(b)}`,String(a*b),`同じ符号の積は正、ちがう符号の積は負。${P(a)}×${P(b)}＝${N(a*b)}。`)},
div(){const b=RN(-9,9),q=RN(-9,9),a=b*q;return W("正の数・負の数",`次の計算をしなさい。\n${P(a)}÷${P(b)}`,String(q),`符号のきまりは乗法と同じです。${P(a)}÷${P(b)}＝${N(q)}。`)},
pow(){const t=R(0,2);let a,q,ans,e;
 if(t===0){a=R(2,9);q=`(−${a})²`;ans=a*a;e=`(−${a})×(−${a})＝${ans}。負の数どうしの積なので正になります。`}
 else if(t===1){a=R(2,9);q=`−${a}²`;ans=-a*a;e=`−(${a}×${a})＝${N(ans)}。2乗するのは ${a} だけで、その前に − がつきます。`}
 else{a=R(2,4);q=`(−${a})³`;ans=-a*a*a;e=`(−${a})×(−${a})×(−${a})＝${N(ans)}。負の数を3個かけるので負になります。`}
 return W("正の数・負の数",`次の計算をしなさい。\n${q}`,String(ans),e)},
mix(){const t=R(0,2);const a=RN(-10,10),b=RN(-6,6),c=RN(-6,6);let q,ans,e;
 if(t===0){q=`${N(a)}＋${P(b)}×${P(c)}`;ans=a+b*c;e=`乗法を先に計算します。${P(b)}×${P(c)}＝${N(b*c)}、${N(a)}＋${P(b*c)}＝${N(ans)}。`}
 else if(t===1){const d=b*c;q=`${N(a)}−${P(d)}÷${P(c)}`;ans=a-b;e=`除法を先に計算します。${P(d)}÷${P(c)}＝${N(b)}、${N(a)}−${P(b)}＝${N(ans)}。`}
 else{q=`${P(b)}×(${N(a)}＋${P(c)})`;ans=b*(a+c);e=`かっこの中を先に計算します。${N(a)}＋${P(c)}＝${N(a+c)}、${P(b)}×${P(a+c)}＝${N(ans)}。`}

/* ---- 文字の式 ---- */

 if(t===0){const k=RN(-9,9);const v=pick(["ab","xy","ac"]);q=`${v[0]}×${v[1]}×${P(k)}`;ans=term(k,v,true);e=`数を文字の前に書き、×は省きます。文字はアルファベット順にします。答えは ${ans}。`}
 else if(t===1){const v=pick(["x","a","y"]);q=`${v}×(−1)`;ans="−"+v;e=`−1と文字の積は 1 を省いて −${v} と書きます。`}
 else if(t===2){const k=R(2,9);const v=pick(["a","x"]);q=`${v}÷${k}`;ans=`${v}/${k}`;e=`÷は使わず分数で表します。${v}/${k}（${k}分の${v}）です。`}
 else if(t===3){const v=pick(["x","a"]);const w=pick(["y","b"]);q=`${v}×${v}×${w}`;ans=`${v}^2${w}`;e=`同じ文字の積は累乗の指数を使います。${v}²${w} です（入力は ${v}^2${w} でもOK）。`}

 return W("文字の式",`次の式を、文字式の表し方にしたがって書きなさい。\n${q}`,[ans],e+"\n（2乗は ^2 で入力できます。例：x^2）")},
value(){const x=RN(-5,5),t=R(0,2);let q,ans,e;
 if(t===0){const a=RN(-6,6),b=RN(-9,9);q=`${lin(a,b)}`;ans=a*x+b;e=`x に ${P(x)} を代入します。${N(a)}×${P(x)}${b<0?"−"+(-b):"＋"+b}＝${N(ans)}。`}
 else if(t===1){const b=RN(-6,6);q=`x²${term(b,"x",false)}`;ans=x*x+b*x;e=`x²＝${P(x)}²＝${x*x}、${b}x＝${b}×${P(x)}＝${N(b*x)}。合わせて ${N(ans)}。`}
 else{q=`−x²`;ans=-x*x;e=`−x²＝−(${P(x)}²)＝${N(ans)}。2乗してから − をつけます。`}
 return W("文字の式",`x＝${N(x)} のとき、次の式の値を求めなさい。\n${q}`,String(ans),e)},
linAdd(){const a=RN(-9,9),b=RN(-9,9),c=RN(-9,9),d=RN(-9,9);return W("文字の式",`次の計算をしなさい。\n(${lin(a,b)})＋(${lin(c,d)})`,ansLin(a+c,b+d),`かっこをはずして、x の項どうし、数の項どうしをまとめます。${a}x${term(c,"x",false)}${term(b,"",false)}${term(d,"",false)}＝${lin(a+c,b+d)}。`)},
linSub(){const a=RN(-9,9),b=RN(-9,9),c=RN(-9,9),d=RN(-9,9);return W("文字の式",`次の計算をしなさい。\n(${lin(a,b)})−(${lin(c,d)})`,ansLin(a-c,b-d),`ひくほうのかっこの中の符号をすべて変えてからまとめます。(${lin(a,b)})＋(${lin(-c,-d)})＝${lin(a-c,b-d)}。`)},
mulK(){const k=RN(-6,6),a=RN(-6,6),b=RN(-9,9);return W("文字の式",`次の計算をしなさい。\n${P(k)}(${lin(a,b)})`,ansLin(k*a,k*b),`分配法則で ${P(k)}×${a}x と ${P(k)}×${P(b)} を計算します。答えは ${lin(k*a,k*b)}。`)},
divK(){const k=RN(-5,5),a=RN(-6,6),b=RN(-6,6);return W("文字の式",`次の計算をしなさい。\n(${lin(k*a,k*b)})÷${P(k)}`,ansLin(a,b),`それぞれの項を ${P(k)} でわります。答えは ${lin(a,b)}。`)},
dist2(){const k=RN(-5,5),m=RN(-5,5),a=RN(-5,5),b=RN(-6,6),c=RN(-5,5),d=RN(-6,6);const A=k*a+m*c,B=k*b+m*d;
 return W("文字の式",`次の計算をしなさい。\n${N(k)}(${lin(a,b)})${m<0?"−"+(-m):"＋"+m}(${lin(c,d)})`,ansLin(A,B),`それぞれ分配法則でかっこをはずすと ${lin(k*a,k*b)} と ${lin(m*c,m*d)}。まとめて ${lin(A,B)}。`)},
wordExpr(){const x=pick([80,90,120,150]);const t=R(0,2);
 if(t===0){const n=R(3,7);return C("文字の式",`1本 a 円の鉛筆を ${n} 本買って、1000円札で払ったときのおつりを表す式はどれですか。`,[`1000−${n}a（円）`,`${n}a−1000（円）`,`1000−a（円）`,`1000＋${n}a（円）`],`代金は ${n}a 円なので、おつりは 1000−${n}a（円）です。`)}
 if(t===1){return C("文字の式",`x km の道のりを時速 4 km で歩いたときにかかる時間を表す式はどれですか。`,["x/4（時間）","4x（時間）","4/x（時間）","x−4（時間）"],"時間＝道のり÷速さ なので x÷4＝x/4（時間）です。")}
 return C("文字の式",`a 円の品物を ${x>100?"3":"2"}割引きで買ったときの代金を表す式はどれですか。`,[x>100?"0.7a（円）":"0.8a（円）",x>100?"0.3a（円）":"0.2a（円）",x>100?"a−3（円）":"a−2（円）","a（円）"],x>100?"3割引きは定価の7割なので 0.7a（円）です。":"2割引きは定価の8割なので 0.8a（円）です。")},

/* ---- 1次方程式 ---- */
eq1(){const s=RN(-9,9),a=RN(-9,9);return W("1次方程式",`次の方程式を解きなさい。\n${a===1?"":a===-1?"−":N(a)}x＝${N(a*s)}`,[String(s),"x="+s],`両辺を ${P(a)} でわって x＝${N(s)}。`)},
eq2(){const s=RN(-9,9),a=RN(-7,7),b=RN(-12,12);const c=a*s+b;return W("1次方程式",`次の方程式を解きなさい。\n${lin(a,b)}＝${N(c)}`,[String(s),"x="+s],`${N(b)}を移項して ${a===1?"":a===-1?"−":N(a)}x＝${N(c)}${b<0?"＋"+(-b):"−"+b}＝${N(c-b)}、両辺を ${P(a)} でわって x＝${N(s)}。`)},
eq3(){const s=RN(-8,8);let a,c;do{a=RN(-8,8);c=RN(-8,8)}while(a===c);const b=RN(-12,12);const d=(a-c)*s+b;
 return W("1次方程式",`次の方程式を解きなさい。\n${lin(a,b)}＝${lin(c,d)}`,[String(s),"x="+s],`x の項を左辺、数の項を右辺に移項すると ${lin(a-c,0)}＝${N(d-b)}。両辺を ${P(a-c)} でわって x＝${N(s)}。`)},
eqParen(){const s=RN(-8,8),k=RN(-5,5),b=RN(-6,6),c=RN(-9,9);const r=k*(s+b)+c;
 return W("1次方程式",`次の方程式を解きなさい。\n${N(k)}(${lin(1,b)})${term(c,"",false)}＝${N(r)}`,[String(s),"x="+s],`かっこをはずすと ${lin(k,k*b+c)}＝${N(r)}。移項して ${lin(k,0)}＝${N(r-k*b-c)}、x＝${N(s)}。`)},
eqFrac(){const a=R(2,5),q=RN(-6,6),b=RN(-8,8);const s=a*q,c=q+b;
 return W("1次方程式",`次の方程式を解きなさい。\nx/${a}${term(b,"",false)}＝${N(c)}`,[String(s),"x="+s],`両辺に ${a} をかけて分母をはらうと x${term(a*b,"",false)}＝${N(a*c)}。移項して x＝${N(s)}。`)},
eqDec(){const s=RN(-9,9),a=RN(-9,9),b=RN(-9,9);const c=a*s+b;
 return W("1次方程式",`次の方程式を解きなさい。\n${lin(a/10,b/10)}＝${N(c/10)}`,[String(s),"x="+s],`両辺を10倍すると ${lin(a,b)}＝${N(c)}。これを解いて x＝${N(s)}。`)},
ratio(){const p=R(2,9),q=R(2,9),k=R(1,6);const sol=p*k, rq=q*k;
 return W("1次方程式",`次の比例式を解きなさい。\nx：${rq}＝${p}：${q}`,[String(sol),"x="+sol],`比例式の性質（外側の積＝内側の積）より ${q}x＝${rq}×${p}＝${rq*p}、x＝${sol}。`)},
word1(){const p=pick([60,80,90,110,120,150]),box=pick([100,150,200]),x=R(3,12);const tot=p*x+box;
 return W("1次方程式の利用",`1個 ${p} 円のりんごを何個かと、${box} 円のかごを1つ買ったら、代金の合計は ${tot} 円でした。りんごを何個買いましたか。数字で答えなさい。`,[String(x)],`りんごを x 個とすると ${p}x＋${box}＝${tot}。${p}x＝${tot-box}、x＝${x}（個）。`,"個")},
word2(){const n=R(4,12),a=R(2,4),c=a+R(1,2),b=R(1,n-1);const d=c*n-a*n-b; if(d<=0) return g.word1();
 return W("1次方程式の利用",`鉛筆を何人かの生徒に配ります。1人に ${a} 本ずつ配ると ${b} 本余り、1人に ${c} 本ずつ配ると ${d} 本たりません。生徒の人数を求めなさい。数字で答えなさい。`,[String(n)],`人数を x 人とすると、鉛筆の本数は ${a}x＋${b}＝${c}x−${d}。移項して ${c-a===1?"x＝"+n+"（人）。":(c-a)+"x＝"+(b+d)+"、x＝"+n+"（人）。"}`,"人")},
word3(){const kid=R(8,14),yrs=R(2,10),k=pick([2,3]);const dad=k*(kid+yrs)-yrs; if(dad-kid<20) return g.word2();
 return W("1次方程式の利用",`現在、父は ${dad} 歳、子は ${kid} 歳です。父の年齢が子の年齢の ${k} 倍になるのは何年後ですか。数字で答えなさい。`,[String(yrs)],`x 年後とすると ${dad}＋x＝${k}(${kid}＋x)。${dad}＋x＝${k*kid}＋${k}x、${k-1===1?"x＝"+yrs+"（年後）。":(dad-k*kid)+"＝"+(k-1)+"x、x＝"+yrs+"（年後）。"}`,"年後")},
word4(){const v1=pick([60,70,80]),v2=pick([150,180,200,240]),m=R(5,15);const t=v1*m/(v2-v1); if(!Number.isInteger(t)) return g.word1();
 return W("1次方程式の利用",`弟が家を出て分速 ${v1} m で歩き始めました。その ${m} 分後に兄が家を出て、分速 ${v2} m で同じ道を追いかけました。兄は家を出てから何分後に弟に追いつきますか。数字で答えなさい。`,[String(t)],`兄が x 分後に追いつくとすると、道のりが等しいので ${v1}(${m}＋x)＝${v2}x。${v1*m}＝${v2-v1}x、x＝${t}（分後）。`,"分後")},
eqTerm(){return pick([
 C("1次方程式","等式の一方の辺にある項を、符号を変えて他方の辺に移すことを何といいますか。",["移項","代入","展開","通分"],"符号を変えて反対の辺に移すことを移項といいます。"),
 C("1次方程式","方程式を成り立たせる文字の値を何といいますか。",["方程式の解","係数","定数","比例定数"],"方程式を成り立たせる値を、その方程式の解といいます。"),
 C("1次方程式","x＝3 が解である方程式はどれですか。",["2x−1＝5","x＋3＝0","3x＝1","x−3＝3"],"x＝3を代入すると 2×3−1＝5 となり成り立ちます。")])},

/* ---- 比例・反比例 ---- */
propA(){const a=RN(-6,6),x=RN(-5,5);return W("比例と反比例",`y は x に比例し、x＝${N(x)} のとき y＝${N(a*x)} です。y を x の式で表しなさい。`,[`y=${term(a,"x",true)}`.replace("−","-")],`y＝ax に x＝${N(x)}、y＝${N(a*x)} を代入して a＝${N(a)}。よって y＝${term(a,"x",true)}。`)},
propV(){const a=RN(-6,6),x=RN(-5,5),x2=RN(-6,6);return W("比例と反比例",`y は x に比例し、x＝${N(x)} のとき y＝${N(a*x)} です。x＝${N(x2)} のときの y の値を求めなさい。`,[String(a*x2)],`比例定数は ${N(a*x)}÷${P(x)}＝${N(a)}。y＝${term(a,"x",true)} に x＝${N(x2)} を代入して y＝${N(a*x2)}。`)},
invA(){const x=RN(-6,6),y=RN(-6,6);const k=x*y;return W("比例と反比例",`y は x に反比例し、x＝${N(x)} のとき y＝${N(y)} です。y を x の式で表しなさい。`,[`y=${k}/x`],`y＝a/x より a＝xy＝${P(x)}×${P(y)}＝${N(k)}。よって y＝${N(k)}/x（分数は / で入力）。`)},
invV(){const x=RN(-6,6),y=RN(-6,6);const k=x*y;const ds=[1,2,3,4,6,12].filter(d=>k%d===0);const x2=pick(ds)*pick([1,-1]);
 return W("比例と反比例",`y は x に反比例し、x＝${N(x)} のとき y＝${N(y)} です。x＝${N(x2)} のときの y の値を求めなさい。`,[String(k/x2)],`比例定数は xy＝${N(k)}。y＝${N(k)}/x に x＝${N(x2)} を代入して y＝${N(k/x2)}。`)},
propTerm(){return pick([
 C("比例と反比例","y＝ax（a は定数）で表される関係を何といいますか。",["比例","反比例","1次方程式","相対度数"],"y＝ax の形は比例です。a を比例定数といいます。"),
 C("比例と反比例","反比例のグラフの形として正しいものはどれですか。",["双曲線","原点を通る直線","原点を通らない直線","円"],"反比例のグラフは双曲線とよばれる2つのなめらかな曲線です。"),

const TERMMAP = {
 1:["add","add","sub","sub","add3","abs","cmp","mul","div","pow","mix"],
 2:["mix","mix","pow","mul","div","express","express","value","value","linAdd","linSub","wordExpr"],
 3:["linAdd","linSub","mulK","divK","dist2","value","eq1","eq2","eq2","eq3","eq3","eqParen","eqFrac","eqDec","ratio","word1","word2","word3","word4","eqTerm"],
 4:["eq3","eqParen","word1","word2","word4","ratio","propA","propA","propV","propV","invA","invV","propTerm","propTerm"],
 5:["invA","invV","arc","sector","circle","cyl","cone","pyr","prism","geoTerm","geoTerm","rel","dataTerm","dataTerm"]
};

function make(termId,count){
  const list=TERMMAP[termId], out=[], seen=new Set();
  let guard=0;
  while(out.length<count && guard<count*20){
    guard++;
    const q=g[pick(list)]();
    if(seen.has(q.q)) continue;
    seen.add(q.q); out.push(q);
  }
  return out;
}
return {make, TERMMAP};
})();

/* ===== 基本設定 ===== */
const TERMS=[{id:1,name:"1学期 中間"},{id:2,name:"1学期 期末"},{id:3,name:"2学期 中間"},{id:4,name:"2学期 期末"},{id:5,name:"学年末"}];
const SUBJECTS=[
 {id:"kokugo",name:"国語",pub:"光村図書",color:"var(--kokugo)"},
 {id:"sugaku",name:"数学",pub:"東京書籍",color:"var(--sugaku)",gen:true},
 {id:"rika",name:"理科",pub:"啓林館",color:"var(--rika)"},
 {id:"shakai",name:"社会",pub:"地理 東京書籍／歴史 教育出版",color:"var(--shakai)"},
 {id:"eigo",name:"英語",pub:"開隆堂",color:"var(--eigo)"}
];
const termName=id=>TERMS.find(t=>t.id===id).name;
function guessTerm(){const m=new Date().getMonth()+1;if(m>=4&&m<=10)return 3;if(m===11||m===12)return 4;return 5;}

/* 問題データを使いやすい形に変換 */
function pool(subjId,termId){
  const rows=(DATA[subjId]&&DATA[subjId][termId])||[];
  const k=subjId==="eigo"?"e":"j";
  return rows.map(r=>({t:r[0],u:r[1],q:r[2],a:r[3].split("|"),e:r[4],un:r[5]||"",k}));
}
function available(s,termId){return s.gen?true:pool(s.id,termId).length>0}
function poolSize(s,termId){return s.gen?"∞":pool(s.id,termId).length}

const S={screen:"home",subj:null,term:guessTerm(),count:50,qs:[],idx:0,res:[]};

/* 保存（この端末のブラウザだけ） */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 採点 ===== */
function norm(s,k){
  s=String(s).normalize("NFKC").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  if(k==="m"){return s.replace(/[−‐‑–—―ー－]/g,"-").replace(/[\s^*]/g,"");}
  if(k==="e"){return s.replace(/[.,!?。、]/g," ").replace(/\s+/g," ").trim();}
  s=s.replace(/[\s、。，・「」『』]/g,"").replace(/[.]$/,"");
  return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
function judge(q,input){
  const u=norm(input,q.k); if(!u) return false;
  return q.a.some(a=>{const n=norm(a,q.k);return u===n||(q.un&&u===norm(a+q.un,q.k));});
}

/* ===== 画面 ===== */
const app=document.getElementById("app");
function render(){
  document.documentElement.style.setProperty("--accent",S.subj?S.subj.color:"var(--sugaku)");
  ({home:renderHome,setup:renderSetup,quiz:renderQuiz,result:renderResult})[S.screen]();
  window.scrollTo(0,0);
}

function renderHome(){
  const st=load("chu1-stats2",{});
  app.innerHTML=`
    <h1>中1 テスト対策ドリル</h1>
    <p class="lead">盛岡市立中学校の教科書に合わせた、5教科の定期テスト対策。選択問題と書き問題が出て、答えるとすぐに正解と解説が出ます。</p>
    <span class="term">いまの時期：${termName(S.term)}テスト</span>
    <div class="subjects">
      ${SUBJECTS.map((s,i)=>{const r=st[s.id+"-"+S.term];
        return `<button class="subj ${i===4?"wide":""}" style="--c:${s.color}" data-s="${s.id}">
          <div class="k">${s.name}</div>
          <div class="s">${available(s,S.term)?(r&&r.n?`この時期 ${r.n}問・正答率 ${Math.round(r.ok/r.n*100)}%`:"まだ解いていません"):"この時期の問題は準備中"}</div>
        </button>`}).join("")}
    </div>`;
  app.querySelectorAll(".subj").forEach(b=>b.onclick=()=>{S.subj=SUBJECTS.find(s=>s.id===b.dataset.s);S.screen="setup";render();});
}

function renderSetup(){
  const s=S.subj, ok=available(s,S.term), size=poolSize(s,S.term);
  app.innerHTML=`
    <button class="back" id="bk">← 教科えらびにもどる</button>
    <h1>${s.name}</h1>
    <p class="lead">教科書：${esc(s.pub)}</p>
    <div class="panel top">
      <h2>どのテスト？</h2>
      <div class="seg" id="terms">${TERMS.filter(t=>t.id>=3).map(t=>`<button aria-pressed="${t.id===S.term}" data-t="${t.id}">${t.name}</button>`).join("")}</div>
      <p class="hint">${ok?(s.gen?"数学は数字が毎回変わる問題を自動で作ります。":`この時期の問題は ${size} 問あります。毎回シャッフルして出題します。`):"この時期の問題はまだ入っていません。"}</p>
    </div>
    <div class="panel">
      <h2>問題数</h2>
      <div class="seg" id="cnt">${[10,25,50].map(n=>`<button aria-pressed="${n===S.count}" data-n="${n}">${n}問</button>`).join("")}</div>
    </div>
    <button class="btn" id="go" ${ok?"":"disabled"}>スタート</button>`;
  document.getElementById("bk").onclick=()=>{S.subj=null;S.screen="home";render();};
  app.querySelectorAll("#terms button").forEach(b=>b.onclick=()=>{S.term=+b.dataset.t;renderSetup();});
  app.querySelectorAll("#cnt button").forEach(b=>b.onclick=()=>{S.count=+b.dataset.n;renderSetup();});
  document.getElementById("go").onclick=start;
}

function start(){
  const s=S.subj;
  let qs = s.gen ? MATH.make(S.term,S.count) : shuffle(pool(s.id,S.term)).slice(0,S.count);
  S.qs=qs.map(prep); S.idx=0; S.res=[]; S.screen="quiz"; render();
}
function prep(q){
  if(q.t==="c"){const order=shuffle([0,1,2,3].slice(0,q.a.length));return {...q,choices:order.map(i=>q.a[i]),ans:order.indexOf(0)};}
  return {...q};
}

function renderQuiz(){
  const q=S.qs[S.idx], n=S.qs.length, r=S.res[S.idx], done=r!==undefined;
  const correctText = q.t==="c" ? q.choices[q.ans] : q.a[0]+(q.un&&/^[\d.\-−]+$/.test(q.a[0])?" "+q.un.replace("cm3","cm³"):"");
  app.innerHTML=`
    <div class="progress"><span>${S.subj.name}・${termName(S.term)}</span><span>${S.idx+1} / ${n}</span></div>
    <div class="bar"><i style="width:${(S.idx+(done?1:0))/n*100}%"></i></div>
    <div class="panel top">
      <div><span class="unitTag">${esc(q.u)}</span> <span class="typeTag">${q.t==="c"?"選択":"書き"}</span></div>
      <p class="q">${esc(q.q)}</p>
      ${q.t==="c"?`<div class="choices">${q.choices.map((c,i)=>{let cls="";if(done){if(i===q.ans)cls="correct";else if(i===r.pick)cls="wrong";}
          return `<button class="choice ${cls}" data-c="${i}" ${done?"disabled":""}><b>${"アイウエ"[i]}</b><span>${esc(c)}</span></button>`}).join("")}</div>`
      :`<div class="write">
          <input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
            placeholder="ここに答えを入力" value="${done?esc(r.input):""}" ${done?"disabled":""} class="${done?(r.ok?"okIn":"ngIn"):""}">
          ${done?"":`<button class="btn" id="submit" style="margin-top:10px">答える</button>`}
        </div>`}
      ${done?`
        <div class="verdict ${r.ok?"ok":"ng"}">${r.ok?"正解！":"ざんねん…"}</div>
        <p class="correct">正解：${q.t==="c"?"アイウエ"[q.ans]+"　":""}${esc(correctText)}${q.t==="w"&&q.a.length>1?`<span class="hint">（${q.a.slice(1).map(esc).join("／")} でも正解）</span>`:""}</p>
        <div class="exp">${esc(q.e)}</div>
        ${q.t==="w"&&!r.ok&&!r.forced?`<button class="link" id="force">自分の答えも合っているので正解にする</button>`:""}
        <button class="btn" id="next">${S.idx+1<n?"次の問題へ":"結果を見る"}</button>`:""}
      <button class="link quit" id="quit">ここでやめて結果を見る</button>
    </div>`;
  if(!done){
    if(q.t==="c"){
      app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const p=+b.dataset.c;S.res[S.idx]={pick:p,ok:p===q.ans};renderQuiz();focusNext();});
    }else{
      const inp=document.getElementById("ans");
      const submit=()=>{const v=inp.value;if(!v.trim()){inp.focus();return}S.res[S.idx]={input:v,ok:judge(q,v)};renderQuiz();focusNext();};
      document.getElementById("submit").onclick=submit;
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();submit();}});
      setTimeout(()=>inp.focus(),50);
    }
  }else{
    const f=document.getElementById("force");
    if(f) f.onclick=()=>{S.res[S.idx].ok=true;S.res[S.idx].forced=true;renderQuiz();};
    document.getElementById("next").onclick=()=>{if(S.idx+1<n){S.idx++;render();}else finish();};
  }
  document.getElementById("quit").onclick=()=>{if(S.res.length===0){S.screen="setup";render();return}S.qs=S.qs.slice(0,S.res.filter(x=>x).length);finish();};
}
function focusNext(){const nx=document.getElementById("next");if(nx)nx.scrollIntoView({behavior:"smooth",block:"center"});}

function finish(){
  const n=S.qs.length, ok=S.res.slice(0,n).filter(r=>r&&r.ok).length;
  const st=load("chu1-stats2",{}), key=S.subj.id+"-"+S.term, cur=st[key]||{n:0,ok:0};
  cur.n+=n; cur.ok+=ok; st[key]=cur; save("chu1-stats2",st);
  S.screen="result"; render();
}

function renderResult(){
  const n=S.qs.length, ok=S.res.slice(0,n).filter(r=>r&&r.ok).length;
  const wrong=S.qs.filter((q,i)=>!(S.res[i]&&S.res[i].ok));
  app.innerHTML=`
    <div class="panel top" style="text-align:center">
      <h2>${S.subj.name}の結果</h2>
      <div class="big">${ok}<span style="font-size:1.4rem"> / ${n}</span></div>
      <p class="lead" style="margin:0">${ok===n?"全問正解！この調子です。":ok>=n*0.8?"よくできました。まちがえた問題を見直そう。":"まちがえた問題の解説を読んで、もう一度チャレンジしよう。"}</p>
    </div>
    ${wrong.length?`<button class="btn" id="retry">まちがえた ${wrong.length} 問だけもう一度</button>`:""}
    <button class="btn ${wrong.length?"ghost":""}" id="again">もう一回（新しくシャッフル）</button>
    <button class="btn ghost" id="home">教科えらびにもどる</button>
    <div class="panel">
      <h2>ふりかえり</h2>
      ${S.qs.map((q,i)=>{const r=S.res[i]||{};const right=r.ok;
        const corr=q.t==="c"?q.choices[q.ans]:q.a[0];
        const mine=q.t==="c"?(r.pick!==undefined?q.choices[r.pick]:"—"):(r.input||"—");
        return `<div class="review">
          <div><span class="mk" style="color:${right?"var(--ok)":"var(--ng)"}">${right?"○":"×"}</span><b>${esc(q.q)}</b></div>
          <div class="hint">正解：${esc(corr)}${right?"":`／あなたの答え：${esc(mine)}`}</div>
          ${right?"":`<div class="exp" style="margin-top:6px">${esc(q.e)}</div>`}
        </div>`}).join("")}
    </div>`;
  const rb=document.getElementById("retry");
  if(rb) rb.onclick=()=>{S.qs=shuffle(wrong).map(prep);S.idx=0;S.res=[];S.screen="quiz";render();};
  document.getElementById("again").onclick=start;
  document.getElementById("home").onclick=()=>{S.subj=null;S.screen="home";render();};
}

render();

</script>
</body>
</html>
